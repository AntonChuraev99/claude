# insets-spacing — боль #1 (system bars не покрашены) + #3 (кривые отступы).
# Mostly runtime red-flags: enclosure/sibling context can't be proven by grep,
# so these point the reviewer / a real-device check at the right line.

- id: double-system-bar-padding
  pain: 3
  mode: runtime
  severity: medium
  stack: [android, kmp, compose]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: '\.(navigationBarsPadding|statusBarsPadding)\(\)'
  message: "ручной *BarsPadding внутри ModalDrawerSheet/ModalBottomSheet/Scaffold, который уже владеет window-insets, -> двойной отступ, обрезанный футер (особенно landscape / fontScale>=130%)."
  fix: "не добавлять *BarsPadding на контент компонента, который уже применяет DrawerDefaults/sheet windowInsets. Проверить визуально на девайсе."
  source: "agent-memory/design-expert/drawer-scroll-and-insets.md"

- id: ime-gap-check-manifest-first
  pain: 1
  mode: runtime
  severity: medium
  stack: [android]
  globs: ["**/*Activity*.kt", "**/MainActivity.kt"]
  detect:
    type: grep
    has: 'enableEdgeToEdge\('
  message: "edge-to-edge + клавиатура: если IME-инсет = 0 / контент под клавиатурой, корень в AndroidManifest (windowSoftInputMode), НЕ в Compose."
  fix: "у Activity с текстовым вводом проверить windowSoftInputMode=\"adjustResize\" в манифесте ПЕРВЫМ делом, до правок Compose-инсетов."
  source: "improvements (IME insets) + project-memory feedback_compose_ime_insets_check_manifest"

- id: edge-to-edge-bar-tint
  pain: 1
  mode: runtime
  severity: medium
  stack: [android, kmp]
  globs: ["**/*Activity*.kt", "**/MainActivity.kt", "**/*Theme*.kt"]
  detect:
    type: grep
    has: 'enableEdgeToEdge\('
  message: "система покраски status/nav bar: после enableEdgeToEdge проверить, что бары реально окрашены/прозрачны как задумано и контент не уезжает под них на КАЖДОМ форм-факторе (phone/tablet/desktop)."
  fix: "форм-фактор-зависимый padding; nav bar coverage -> contentExtendsBehindNavBar. Проверка визуальная на девайсе, не headless."
  source: "agent-memory/design-expert/drawer-scroll-and-insets.md + active_task_adaptive_ui_migration"

- id: textalign-center-without-fillwidth
  pain: 3
  mode: runtime
  severity: low
  stack: [compose, kmp]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: 'textAlign\s*=\s*TextAlign\.Center'
  message: "TextAlign.Center без fillMaxWidth() центрирует внутри ширины Text (=no-op) -> 'текст уехал влево'."
  fix: "добавить .fillMaxWidth() на Text или обернуть в Box(contentAlignment=Center)."
  source: "agent-memory/compose-feature-expert/reference_compose_pitfalls.md §10.2-A"

# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: localized-text-clipping-fixed-container
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/src/commonMain/**/*.kt'
  - '**/src/androidMain/**/*.kt'
  - '**/src/wasmJsMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: maxLines\s*=\s*1\b
    unless: TextAutoSize|basicMarquee
    lacks: TextAutoSize
  message: Single-line (maxLines=1) Text inside fixed-dp M3 containers (compare-table columns, PlanRow subtitle, PRO/credits badge, pager titles) truncates/clips/wraps on long localized strings (KZT/RU, 'Unlimited'); emulator USD fallback hides the bug.
  fix: Size containers from the longest expected localized value (+~15-20% buffer); use TextAutoSize.StepBased (>=8.sp floor) or widthIn(min=)/let height grow; pair centered & pager Text with fillMaxWidth(); validate on a real KZT/RU locale + physical device, not the USD RemoteConfig fallback on emulator.
  source: ui-improvements/paywall-truthful-copy-and-layout-2026-04-28.md; ui-improvements/paywall-polish-and-locale-fixes-2026-04-28.md; features/paywall-best-practices.md

- id: unbounded-backend-text-pushes-row-sibling-out
  area: insets-spacing
  mode: runtime
  severity: medium
  stack: [compose, kmp]
  globs:
  - '**/src/commonMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: horizontalArrangement\s*=\s*Arrangement\.spacedBy
  message: Backend-driven Text (nullable String из DTO, без enum-контракта) без maxLines/overflow/weight в Row рядом с сиблингом — длинная строка выталкивает сиблинг за границу клипающего родителя, сиблинг и его contentDescription исчезают. Особо опасно при рефакторинге «перенесли из независимых якорей (TopStart/TopEnd) в общий Row». localized-text-clipping-fixed-container это НЕ ловит - оно кейится на maxLines=1, а здесь maxLines нет вовсе.
  fix: maxLines=1 + overflow=Ellipsis + Modifier.weight(1f, fill=false) на растяжимый Text (сиблинг сохраняет intrinsic-ширину), либо widthIn(max=). Golden/скриншот-тест с САМЫМ ДЛИННЫМ реалистичным значением с бэка, не с образцовым коротким.
  source: PortalEffectCard.kt 2026-07-20 (badge TopStart+pill TopEnd -> общий Row -> длинный badge прячет type-pill)
