# insets-spacing — боль #1 (system bars не покрашены) + #3 (кривые отступы).
# Mostly runtime red-flags: enclosure/sibling context can't be proven by grep,
# so these point the reviewer / a real-device check at the right line.

- id: double-system-bar-padding
  pain: 3
  mode: runtime
  severity: medium
  stack: [android, kmp, compose]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: '\.(navigationBarsPadding|statusBarsPadding)\(\)'
  message: "ручной *BarsPadding внутри ModalDrawerSheet/ModalBottomSheet/Scaffold, который уже владеет window-insets, -> двойной отступ, обрезанный футер (особенно landscape / fontScale>=130%)."
  fix: "не добавлять *BarsPadding на контент компонента, который уже применяет DrawerDefaults/sheet windowInsets. Проверить визуально на девайсе."
  source: "agent-memory/design-expert/drawer-scroll-and-insets.md"

- id: ime-gap-check-manifest-first
  pain: 1
  mode: runtime
  severity: medium
  stack: [android]
  globs: ["**/*Activity*.kt", "**/MainActivity.kt"]
  detect:
    type: grep
    has: 'enableEdgeToEdge\('
  message: "edge-to-edge + клавиатура: если IME-инсет = 0 / контент под клавиатурой, корень в AndroidManifest (windowSoftInputMode), НЕ в Compose."
  fix: "у Activity с текстовым вводом проверить windowSoftInputMode=\"adjustResize\" в манифесте ПЕРВЫМ делом, до правок Compose-инсетов."
  source: "improvements (IME insets) + project-memory feedback_compose_ime_insets_check_manifest"

- id: edge-to-edge-bar-tint
  pain: 1
  mode: runtime
  severity: medium
  stack: [android, kmp]
  globs: ["**/*Activity*.kt", "**/MainActivity.kt", "**/*Theme*.kt"]
  detect:
    type: grep
    has: 'enableEdgeToEdge\('
  message: "система покраски status/nav bar: после enableEdgeToEdge проверить, что бары реально окрашены/прозрачны как задумано и контент не уезжает под них на КАЖДОМ форм-факторе (phone/tablet/desktop)."
  fix: "форм-фактор-зависимый padding; nav bar coverage -> contentExtendsBehindNavBar. Проверка визуальная на девайсе, не headless."
  source: "agent-memory/design-expert/drawer-scroll-and-insets.md + active_task_adaptive_ui_migration"

- id: textalign-center-without-fillwidth
  pain: 3
  mode: runtime
  severity: low
  stack: [compose, kmp]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: 'textAlign\s*=\s*TextAlign\.Center'
  message: "TextAlign.Center без fillMaxWidth() центрирует внутри ширины Text (=no-op) -> 'текст уехал влево'."
  fix: "добавить .fillMaxWidth() на Text или обернуть в Box(contentAlignment=Center)."
  source: "agent-memory/compose-feature-expert/reference_compose_pitfalls.md §10.2-A"

# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: localized-text-clipping-fixed-container
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/src/commonMain/**/*.kt'
  - '**/src/androidMain/**/*.kt'
  - '**/src/wasmJsMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: maxLines\s*=\s*1\b
    unless: TextAutoSize|basicMarquee
    lacks: TextAutoSize
  message: Single-line (maxLines=1) Text inside fixed-dp M3 containers (compare-table columns, PlanRow subtitle, PRO/credits badge, pager titles) truncates/clips/wraps on long localized strings (KZT/RU, 'Unlimited'); emulator USD fallback hides the bug.
  fix: Size containers from the longest expected localized value (+~15-20% buffer); use TextAutoSize.StepBased (>=8.sp floor) or widthIn(min=)/let height grow; pair centered & pager Text with fillMaxWidth(); validate on a real KZT/RU locale + physical device, not the USD RemoteConfig fallback on emulator.
  source: ui-improvements/paywall-truthful-copy-and-layout-2026-04-28.md; ui-improvements/paywall-polish-and-locale-fixes-2026-04-28.md; features/paywall-best-practices.md

- id: unbounded-backend-text-pushes-row-sibling-out
  area: insets-spacing
  mode: runtime
  severity: medium
  stack: [compose, kmp]
  globs:
  - '**/src/commonMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: horizontalArrangement\s*=\s*Arrangement\.spacedBy
  message: Backend-driven Text (nullable String из DTO, без enum-контракта) без maxLines/overflow/weight в Row рядом с сиблингом — длинная строка выталкивает сиблинг за границу клипающего родителя, сиблинг и его contentDescription исчезают. Особо опасно при рефакторинге «перенесли из независимых якорей (TopStart/TopEnd) в общий Row». localized-text-clipping-fixed-container это НЕ ловит - оно кейится на maxLines=1, а здесь maxLines нет вовсе.
  fix: maxLines=1 + overflow=Ellipsis + Modifier.weight(1f, fill=false) на растяжимый Text (сиблинг сохраняет intrinsic-ширину), либо widthIn(max=). Golden/скриншот-тест с САМЫМ ДЛИННЫМ реалистичным значением с бэка, не с образцовым коротким.
  source: PortalEffectCard.kt 2026-07-20 (badge TopStart+pill TopEnd -> общий Row -> длинный badge прячет type-pill)

- id: rounded-corner-reveals-whatever-is-behind
  area: insets-spacing
  pain: 1
  mode: runtime
  severity: medium
  stack: [compose, kmp]
  globs:
  - '**/src/commonMain/**/*.kt'
  - '**/src/androidMain/**/*.kt'
  - '**/src/wasmJsMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: 'RoundedCornerShape\(\s*(top|Corner)'
  message: >-
    Скруглённый угол у поверхности, лежащей ПОВЕРХ чего-то (нижний бар, док, липкий CTA, sheet):
    вырезанный угол прозрачен, и в нём видно НЕ то, что задумано, а что окажется под ним в этот
    момент — карточка списка, фон окна, соседняя поверхность. Симптом у владельца звучит как
    «по краям проглядывается белый / задник». Три отдельные ловушки:
    (1) под углом проезжает БЕЛАЯ карточка при кремовой странице — разница ~1-2 ΔL*, на PNG глазом
    не видна, поэтому доезжает до устройства;
    (2) фон ОКНА (windowBackground) отличается от фона страницы или не имеет -night варианта —
    в углу белое только в тёмной теме;
    (3) две скруглённые поверхности встык (док на баре) с РАЗНЫМ радиусом дают зазор-зарубку в шве;
    (4) САМАЯ КОВАРНАЯ — `Modifier.clip(...)` у поверхности, под которой не рисует НИКТО
    (edge-anchored: бар последним ребёнком Column, контент кончается на его кромке). Клип режет
    дыру насквозь всей композиции, и в плечах виден задник ХОСТА: windowBackground на Android,
    Robolectric-фон в тесте, пустота за Skiko-канвасом на wasmJs. Диагностический признак —
    один и тот же цвет в СВЕТЛОЙ и ТЁМНОЙ теме (у нас #FAFAFA в обеих): значит цвет резолвится
    не против дизайн-системы, а против того, на чём висит композиция.
  fix: >-
    Под скруглённой поверхностью держать сплошную подложку её же цвета (или вырезать угол над
    заведомо известным фоном), а не над скроллящимся содержимым. Радиус у стыкующихся поверхностей
    брать из ОДНОГО токена; скруглять только ту кромку, которая реально верхняя (для нижнего хрома —
    гейт по «док открыт»). windowBackground задавать явно и с values-night.
    Для случая (4) — `background(цвет).clip(форма)` В ТОЙ ЖЕ цепочке модификаторов: левый оборачивает
    правый, поэтому подложка красит полный прямоугольник узла, а клип режет только то, что после него.
    Обратный порядок красит дыру второй раз. Sibling-Box по измеренной высоте — хуже: отстаёт на кадр
    там, где поверхность растёт (перенос лейбла на fontScale >= 1.3).
    Проверять ПИКСЕЛЬНЫМ ассертом в обоих углах (RGB), с прокрученным под кромку списком, и рендерить
    тест на СЕНТИНЕЛ-подложке (#FF00FF): дыра тогда проваливает тест громко и не может пройти
    случайно из-за похожего дефолтного фона хоста. «Выглядит нормально» на скриншоте этот класс
    не ловит по построению.
  source: >-
    <your-project> ux-overhaul 2026-08-14 — три раза подряд в одной сессии: notch между доком и баром
    (24dp vs 20dp), белое под баром в dark (нет themes.xml + тема в DataStore, а не в night-флаге),
    белое в углах бара после скругления 28dp. Владелец: «очень часто с округлением такие баги».

- id: padding-outside-scroll-clips-viewport
  pain: 3
  mode: runtime
  severity: medium
  stack: [android, kmp, compose]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: '\.(horizontalScroll|verticalScroll)\('
  message: >-
    Прокручиваемый Row/Column: горизонтальный (вертикальный) отступ, применённый ДО
    `.horizontalScroll()` в той же цепочке модификаторов — или пришедший снаружи в `modifier`
    от вызывающего, — ужимает САМ ВЬЮПОРТ прокрутки. Содержимое обрезается по внутренней кромке
    отступа и не доезжает до края экрана: крайний чип/карточка выглядят «отрезанными» ровно на
    величину инсета, и видно это ТОЛЬКО в прокрученном состоянии — статичный кадр и голден
    первого экрана дефект не показывают.
    Особо коварен случай, когда padding кладёт ВЫЗЫВАЮЩИЙ (`modifier = Modifier.padding(...)`),
    а `.horizontalScroll()` висит внутри компонента: в файле компонента отступа не видно вообще,
    а KDoc вида «horizontal inset comes from the caller» закрепляет дефект как контракт.
  fix: >-
    Инсет должен ехать ВМЕСТЕ с содержимым, как `contentPadding` у LazyRow/LazyColumn:
    у ленивых списков — только `contentPadding`, никогда `Modifier.padding` снаружи;
    у не-ленивых — padding ПОСЛЕ `.horizontalScroll(...)` в цепочке (то есть внутри вьюпорта),
    либо отдельным параметром компонента, а не через общий `modifier`.
    Приколотые к краю элементы (иконка справа от прокручиваемого ряда) в прокрутку не входят —
    им свой концевой отступ.
    Проверять тестом на ПРОКРУЧЕННОМ состоянии (последний элемент достигает кромки контейнера),
    а не голденом стартового кадра.
  source: >-
    <your-project> 2026-08-19, Generation-каталог: ряд `[Personalize][All types][Photos][Videos]`
    обрезался при скролле. `CatalogControlsRow` брал `.padding(horizontal = 12.dp)` из вызывающего,
    внутри `CatalogTypeFilterRow` вешал `.fillMaxWidth().horizontalScroll(...)`. Голдены ряда были
    зелёные (снимают непрокрученное состояние), L1 промолчал — правила не существовало.
    Владелец: «ряд с personalise обрезается горизонтальным padding-ом при скроле, check rules
    должен был это поймать».
