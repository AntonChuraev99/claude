# compose-state — Compose state / Flow / recomposition / progress-source recurring bugs.
# Mined 2026-06-29; runtime probation.
# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: compose-oneshot-event-as-launchedeffect-key
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - compose
  - kmp
  - android
  globs:
  - '**/commonMain/**/*.kt'
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: LaunchedEffect\([^)]*[Tt]rigger[^)]*\)
    unless: receiveAsFlow|Channel<|//
  message: 'A one-shot signal (scroll-to-top / reopen-sheet) is modeled as persistent state and used directly as a LaunchedEffect key (e.g. an Int *Trigger): the value survives recomposition/backstack-return, so the new LaunchedEffect sees the same non-neutral key and re-fires the action.'
  fix: Model one-shot events as Channel<Unit>(CONFLATED).receiveAsFlow() collected in LaunchedEffect(Unit){ flow.collect { ... } }; keep any remember{mutableStateOf(...)} initial value neutral (false/0) and make a single LaunchedEffect the source of truth for the state, not the Int trigger.
  source: ui-bugs/app-tab-selector-intarray-race-condition-2026-05-15.md; kmp/compose-scroll-trigger-channel-event-pattern-2026-05-06.md; kmp/app-item-sheet-reopen-split-layout-adaptive-2026-05-20.md
- id: compottie-completion-without-null-composition-guard
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - compose
  - kmp
  - android
  globs:
  - '**/commonMain/**/*.kt'
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: \bisAtEnd\b
    unless: //
    lacks: composition\s*[!=]=\s*null|composition\?\.|has\w*Started
  message: A Compottie completion callback is driven off isAtEnd with no composition!=null guard; animateLottieCompositionAsState(composition = null) returns isAtEnd=true, so onComplete/onFirstSpinComplete fires on the async JSON-load tick instead of real animation end (manifests only on slow devices).
  fix: Gate isPlaying and every progress/isAtEnd LaunchedEffect on composition != null (early-return if null and add composition to the effect keys); fire onComplete only when isAtEnd && hasStarted, where hasStarted flips true only after real progress movement (> 0.01f); capture initialProgress only after the composition loads.
  source: kmp/app-android-postmigration-compottie-painter-bug-2026-04-27.md
- id: flow-combine-with-never-emitting-source
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: combine\s*\([^)]*emptyFlow\s*\(
    unless: Fake|Test|Preview|//
  message: A Flow combine(...) includes emptyFlow() (or another never-emitting source) inline; combine emits only after EVERY input has emitted at least once, so the derived gate/state never resolves and stays on its initial fallback (onboarding always shows / splash hangs for every user).
  fix: Never feed emptyFlow()/never-emitting flows into combine(); seed every source with an initial emission (onStart { emit(default) }, stateIn(scope, started, initial), or flowOf(default)); for optional sources use a nullable initial value rather than emptyFlow() so combine can emit immediately.
  source: 'cluster incident: onboarding always showing due to emptyFlow in combine (app); docs/solutions/runtime-errors/splash-navigation-race-channel-fix-2026-04-28.md'
- id: progress-from-template-instead-of-fill
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - kmp
  - compose
  globs:
  - '**/feature/home/**/*.kt'
  - '**/presentation/**/*.kt'
  detect:
    type: grep
    has: \b(checklist|template)\w*\.items\.(count|filter|any|all|none|sumOf)\s*\{[^}]*\bchecked\b
    unless: '[Ff]ill|//'
  message: Completion/progress is computed from Checklist.items (the immutable template, always checked=false) instead of the default ChecklistFill.items that holds real user state, so the main/detail screen shows 0%/stale progress even though items are checked.
  fix: Derive total/checked/progress from the default ChecklistFill.items (fall back to the template size only for the total when no fill exists); compose a ChecklistWithProgress in the ViewModel via flatMapLatest/combine that takes the checked counts exclusively from the fill instance.
  source: docs/solutions/logic-errors/progress-bar-shows-zero-using-template-instead-of-fill.md; docs/solutions/ui-bugs/checklist-detail-overflow-menu-quick-add-bugs.md
- id: compose-render-state-non-snapshot-or-late-update
  mode: runtime
  severity: medium
  stack:
  - compose
  - android
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: remember\s*(\([^)]*\))?\s*\{\s*(IntArray|FloatArray|LongArray|DoubleArray|arrayOfNulls|Array<)
    unless: mutableStateListOf|snapshotStateListOf|//
  message: 'Render/scroll-sync state held in a non-snapshot array (IntArray/Array remembered then mutated from onSizeChanged/onGloballyPositioned) or updated late in LifecycleEventEffect(ON_RESUME): element writes are invisible to recomposition, so the first frame / tab indicator freezes on stale cold-cache measurements.'
  fix: Store measured widths/positions in mutableStateListOf or per-item mutableStateOf (snapshot-observable); derive readiness with derivedStateOf instead of a latched Boolean ready-flag; key the LaunchedEffect on the computed target values (targetLeft/targetRight) so a re-measure re-runs it; update the render-driving value inside composition via LaunchedEffect BEFORE the first layout pass, never in ON_RESUME.
  source: ui-bugs/app-tab-selector-intarray-race-condition-2026-05-15.md; architecture/catalog-loading-state-scaffold-unification-2026-05-07.md; kmp/app-result-video-stale-first-render-wasmjs-2026-05-21.md
- id: shared-component-optional-param-silent-default
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: ':\s*\([^)]*\)\s*->\s*\w+\s*=\s*\{\s*\}'
    unless: //
  message: 'Новый параметр-колбэк общего @Composable с no-op дефолтом (= {}) при 2+ живых call-site: компонент рендерится на N поверхностях (dock/full/вложенный экран), опциональный колбэк молча отключает фичу на забытой поверхности — компилятор молчит, ловится только прогоном на КАЖДОЙ поверхности.'
  fix: 'Делать параметр обязательным (без дефолта) — новая поверхность не соберётся, пока колбэк не проведён; либо source-parsing-тест всех call-site (образец ChatMessageKeyResolutionTest).'
  source: 'D1 2026-07-15 (2 регрессии, SHA 3371fc75); D2 AiChoiceResponse.onMemoryToggle; NEW_RULE_CANDIDATE bug-pattern-reviewer L2'
- id: derived-state-mirror-initial-emission-refires-host-oneshot
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: LaunchedEffect\((\w+)\)\s*\{\s*on\w+Changed\(\1\)
    unless: ^\s*(//|\*)
  message: 'Производный boolean-миррор (targetValue == X), репортящийся хосту через LaunchedEffect(mirror), эмитит и своё НАЧАЛЬНОЕ нейтральное значение; если хост держит one-shot (analytics/screenView/seed) на ключе того же флага, предварительно выставленный true сбрасывается в false и ставится заново — one-shot стреляет ДВАЖДЫ за одно открытие.'
  fix: 'Репортить только переходы (snapshotFlow{state}.first{it==X} / .drop(1)) плюс терминальный DisposableEffect.onDispose; либо заменить boolean-ключ хоста на Channel(CONFLATED). Маунт-время миррор не должен писать состояние хоста.'
  source: 'todoist-nav-v2 iter2 2026-07-27 (V2ChatDockOverlay.onExpandedChanged -> ai_chat_opened x2, ломало метрику живого A/B); родственно csat-one-shot-channel-pattern-2026-07-27'
# === added 2026-07-29 (web restore banner shipped with empty text; 2nd occurrence of the class) ===
- id: banner-text-from-captured-stringresource
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  - wasmjs
  globs:
  - '**/commonMain/**/*.kt'
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  - '**/wasmJsMain/**/*.kt'
  detect:
    type: grep
    has: (SuccessWithText|InfoWithText|ErrorWithText)\(\s*(?!")[a-z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)*\s*[,)]
    unless: getString\(|stringResource\(|rememberUpdatedState\(|\(\s*it\.|^\s*(//|\*)
  message: 'App Top Banner text is passed as a captured variable. Compose Resources load ASYNCHRONOUSLY on every target: the FIRST composition returns "" — so any value read from stringResource and then frozen (LaunchedEffect(Unit){collect}, remember without that value in its keys, a handler/VM that outlives the composition) shows the banner with NO text at all, forever.'
  fix: 'Resolve the copy at the moment it is shown, not at composition time: inside a coroutine use suspend getString(Res.string.x); for an object that outlives the composition pass a provider () -> Texts built with rememberUpdatedState. A lambda recreated on every composition (onClick = { showTopBanner(msg) }) is safe, and so is a local resolved by getString a few lines above inside the same collect — that shape is a known false positive of this line-level grep. Verify live — an empty banner from a frozen string looks IDENTICAL to the nested-viewport font bug, tell them apart by logging text.length at send time.'
  source: 'app: docs/solutions/wasm-bugs/app-top-banner-empty-text-stale-string-capture-2026-07-29.md; .claude/rules/app-top-banner.md'
- id: stringresource-snapshot-into-outliving-object
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/*Handler*.kt'
  - '**/*Service*.kt'
  - '**/*Manager*.kt'
  - '**/*Launcher*.kt'
  - '**/*Controller*.kt'
  detect:
    type: grep
    has: =\s*stringResource\(
    unless: ^\s*(//|\*)
    lacks: rememberUpdatedState\(|getString\(
  message: 'stringResource value is snapshotted inside a handler/service/manager file — these objects are typically built once (remember(...) / Koin scope) and outlive the composition, so they keep the EMPTY first-composition strings that Compose Resources return before the async load finishes.'
  fix: 'Hand the object a provider instead of a snapshot: val current by rememberUpdatedState(texts); remember(key) { Impl(texts = { current }) }. Alternatively resolve with suspend getString(Res.string.x) inside the coroutine that actually shows the copy.'
  source: 'app: docs/solutions/wasm-bugs/app-top-banner-empty-text-stale-string-capture-2026-07-29.md (ShareHandler.android.kt DownloadBannerTexts)'

- id: alpha-zero-hides-node-but-keeps-infinite-animation
  mode: runtime
  severity: medium
  stack:
  - compose
  - kmp
  globs:
  - '**/*.kt'
  detect:
    type: grep
    has: \.alpha\(\s*if\s*\(
    unless: ^\s*(//|\*)
  message: 'Замена условного снятия узла (AnimatedVisibility / early return) на Modifier.alpha(0f) оставляет поддерево скомпонованным: шиммер-плейсхолдер / rememberInfiniteTransition внутри продолжает инвалидировать draw вечно и невидимо (на Skiko = постоянный repaint канваса), а прежний disposal-путь по onError исчезает.'
  fix: 'Прятать отсутствием узла (early return по state) там, где состояние конечное (blank data, error); alpha(0f) оставлять только для loading-фазы, где узел обязан жить, чтобы запрос стартовал — и убедиться, что внутри нет infinite-анимаций.'
  source: 'app: docs/solutions/profile-face-badge-flicker-2026-07-31.md (FaceAvatarBadge; AppPlaceholder = rememberInfiniteTransition, прецедент 376 рекомпозиций/сек)'
- id: gating-flow-stuck-on-terminal-loading
  mode: runtime
  severity: medium
  probation: '2026-11-13'
  target_mode: static
  stack:
  - compose
  - kmp
  - android
  globs:
  - '**/commonMain/**/*.kt'
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: flowOf\s*\(\s*[A-Za-z.]*Loading
    unless: Fake|Test|Preview|//|timeout|withTimeout|onStart
  message: 'A gating flow returns a constant Loading flow for the "not resolved yet" branch (e.g. flatMapLatest
    { if (state is Loading) flowOf(Loading) }). If the upstream source never emits at all - a callback
    silently dropped rather than failing - the flow stays Loading forever. Consumers that gate a CTA on
    "not Loading" lose their only way forward, and .catch does not help: "the callback never arrived"
    is not an exception.'
  fix: 'Give the consumer a ceiling the way the start gate already does: treat Loading longer than N seconds
    as resolved-but-empty with a working exit, or seed the source with onStart { emit(...) }. Never gate
    the only forward action purely on a non-Loading state.'
  source: '<your-project> onboarding reveal deadlock 2026-08-13 (L2 review): the content repository flow
    returns flowOf(Loading) while isPremiumPurchased is Loading, OnboardingRevealPage CTA is enabled only
    on Ready -> no exit at all when RevenueCat is silent.'
