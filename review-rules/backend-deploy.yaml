# backend-deploy — боль #4 (задеплоили не в тот регион) + смежные deploy-классы.
# Один и тот же симптом (404 text/plain / CORS-fail) маскирует три корня:
# wrong-region, deploy-skew (код в репо != на проде), стёртый конфиг.

- id: firebase-functions-region
  pain: 4
  mode: static
  severity: high
  stack: [firebase, wasmjs, nextjs]
  globs: ["**/init.js", "**/*[Ff]unctions*.kt", "**/firebase*.{js,ts}", "**/*[Ff]unctions*.{js,ts}"]
  detect:
    type: grep
    has: 'getFunctions\('
    lacks: '(FUNCTIONS_REGION|getFunctions\([^)]*,\s*["''][a-z]+-[a-z]+\d)'
  message: "getFunctions() без явного региона -> клиент бьёт в дефолтный us-central1; если функция в europe-west* -> 404/CORS. Боль #4 маскируется под deploy-skew."
  fix: "регион из ОДНОЙ env-константы (FUNCTIONS_REGION). Assert совпадения на 3 концах: клиентский URL, setGlobalOptions({region}) в коде функции, --region в deploy."
  source: "improvements/2026-05-08-firebase-deploy-reminders.md + project-memory gcloud-deploy region note"

- id: deploy-set-flags-wipe-config
  mode: static
  severity: high
  stack: [gcp, firebase]
  globs: ["**/deploy*.sh", "**/*deploy*.sh", "**/.gitlab-ci.yml", "**/cloudbuild.{yaml,yml}"]
  detect:
    type: grep
    has: '--set-(env-vars|secrets)\b'
  message: "--set-env-vars / --set-secrets имеют replace-семантику: на redeploy затирают существующие секреты/env (/secrets/sa-key.json, GEMINI_API_KEY) -> 'работало вчера, сломалось сегодня'."
  fix: "использовать --update-env-vars / --update-secrets (merge-семантика) при инкрементальном деплое."
  source: "agent-memory/doc-writer/cross-service-deployment-patterns.md Pattern 2"

- id: cloud-functions-deploy-skew
  mode: runtime
  severity: medium
  stack: [firebase, gcp]
  globs:
    ["**/firebase-functions/**/*.py", "**/functions/**/*.{py,js,ts}", "**/main.py", "**/index.{js,ts}"]
  detect:
    type: glob
  message: "тронут код Cloud Functions: git merge != deploy. Running revision может быть старше мерджа -> клиент бьёт в старый код (CORS/404)."
  fix: "после правки: задеплоить ЯВНО + smoke `curl -i -X OPTIONS <client-URL> -H 'Origin: ...'` (ждать 204 + ACAO). Сверить revision/updateTime новее коммита."
  source: "improvements/2026-05-08-firebase-deploy-reminders.md + cross-service-deployment-patterns.md Pattern 1"

- id: wrangler-account-and-workers-dev
  mode: runtime
  severity: medium
  stack: [cloudflare]
  globs: ["**/wrangler.{toml,jsonc,json}"]
  detect:
    type: glob
  message: "правка wrangler-конфига: деплой может уйти не в тот CF-аккаунт; добавление routes молча выключает workers_dev (legacy *.workers.dev URL умирает)."
  fix: "перед деплоем `wrangler whoami` == ожидаемый аккаунт; явный \"workers_dev\": true, если legacy URL ещё нужен."
  source: "project-memory cloudflare-deploy-accounts-and-workers-dev-default"

# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: gen2-function-iam-via-gen1-api
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - gcp
  - firebase
  globs:
  - '**/*deploy*.{sh,py}'
  detect:
    type: grep
    has: gcloud functions add-iam-policy-binding
    lacks: gcloud run services add-iam-policy-binding
  message: Gen1 IAM API (`gcloud functions add-iam-policy-binding`) grants invoker — but it silently no-ops for a --gen2 function (backed by Cloud Run). Deploy log prints 'Updated IAM policy / deployed successfully', yet a curl POST to the URL returns 403.
  fix: For --gen2 functions grant invoke via `gcloud run services add-iam-policy-binding <name-with-hyphens> --member=allUsers --role=roles/run.invoker` (or --allow-unauthenticated at deploy time), then smoke-test the URL expecting a non-403 response before marking the deploy done.
  source: deployment-issues/gen2-cloud-functions-iam-policy.md
- id: gradle-daemon-jvm-properties-committed
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - gradle
  - ci
  - cloudflare
  globs:
  - '**/gradle/gradle-daemon-jvm.properties'
  detect:
    type: glob
  message: Committed gradle/gradle-daemon-jvm.properties forces clean CI to provision a JDK through foojay.io -> fragile 'Could not HEAD api.foojay.io 400' failures on EVERY branch; local builds pass (JDK cached in ~/.gradle/jdks).
  fix: Delete gradle/gradle-daemon-jvm.properties; install the JDK explicitly in .cloudflare/build.sh (download Temurin from github.com/adoptium, export JAVA_HOME/PATH). Never re-run ./gradlew updateDaemonJvm without updating the CI script — it re-pins to the local dev JVM.
  source: ci-deploy/cloudflare-workers-builds-jvm-21-foojay-400-fix-2026-06-17.md
- id: gradle-string-by-project-delegate
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - gradle
  - kmp
  globs:
  - '**/build.gradle.kts'
  detect:
    type: grep
    has: val\s+\w+\s*:\s*String\s+by\s+project
    unless: ^\s*(//|\*|/\*)
  message: '`val X: String by project` reads a required property at the CONFIGURATION phase and throws when it is absent in CI; Gradle evaluates all config (e.g. :androidApp signing) even when building an unrelated target (:app:wasmJs), so one missing secret aborts the entire build.'
  fix: 'Read optional props with findProperty("X") as? String ?: "<placeholder>" (nullable + default) instead of the strict `by project` delegate; provide CI placeholders in local.defaults.properties.'
  source: ci-deploy/cloudflare-workers-builds-kmp-wasmjs-setup-2026-04-21.md
- id: gradle-wrapper-in-gitignore
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - gradle
  - ci
  globs:
  - '**/.gitignore'
  detect:
    type: grep
    has: ^\s*/?(gradlew(\.bat)?|gradle/wrapper)/?\s*$
  message: 'Gradle wrapper (gradlew / gradlew.bat / gradle/wrapper) listed in .gitignore makes a clean CI checkout unbuildable (''chmod: cannot access gradlew''); local builds pass because the wrapper is on disk and git status never flags it.'
  fix: Remove gradlew, gradlew.bat and gradle/wrapper from .gitignore and `git add -f` them — the wrapper is a tracked convention artifact required for reproducible builds.
  source: ci-deploy/cloudflare-workers-builds-kmp-wasmjs-setup-2026-04-21.md
- id: wrangler-spa-assets-missing-run-worker-first
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - cloudflare
  - wasmjs
  - web
  globs:
  - '**/wrangler.{jsonc,toml,json}'
  detect:
    type: grep
    has: single-page-application
    lacks: run_worker_first
  message: 'wrangler SPA assets (not_found_handling=single-page-application) WITHOUT run_worker_first: Static Assets intercept top-level navigations (Sec-Fetch-Mode: navigate) before the Worker, so POST-navigation OAuth form_post callbacks get 405 and never reach the Worker. curl/fetch don''t send navigate, so it passes every non-browser test.'
  fix: 'Add assets.run_worker_first listing the OAuth callback + auth-proxy paths (e.g. /apple-callback, /__/auth/*, /__/firebase/*) in EVERY env''s wrangler config (staging AND prod); verify with curl -X POST -H ''Sec-Fetch-Mode: navigate'' expecting 303, not 405.'
  source: ci-deploy/apple-signin-web-safari-popup-blocked-diag-relay-2026-06-16.md

- id: optional-analytics-secret-silent-noop
  mode: runtime
  target_mode: static
  severity: medium
  stack:
  - cloudflare
  - web
  - backend
  globs:
  - '**/types.ts'
  - '**/analytics.*'
  - '**/*init.js*'
  detect:
    type: grep
    has: '[A-Z_]*(ANALYTICS|AMPLITUDE|MEASUREMENT|GA4)[A-Z_]*\??\s*:\s*string'
    lacks: 'wrangler secret put|Secret Manager|required'
  message: 'An analytics key is declared OPTIONAL and degrades to a silent no-op when unset, so "zero events" becomes indistinguishable from "zero usage" — the metric reads as a product verdict when it is really a config hole. The instrumentation was written to answer exactly the question its own absence now silently mis-answers.'
  fix: 'After deploy, smoke on a LIVE event landing in the analytics project — not on "deploy succeeded". Alternatively fail-fast when the key is unset in a prod env. Verify the secret exists in the deploy target BEFORE trusting any dashboard built on these events.'
  source: 'review 2026-07-16 (875de201) AMPLITUDE_SERVER_API_KEY optional in worker env; plus CI drift shipping measurementId="" so web GA4 may not count. Two documented cases of the same class.'

- id: ci-branch-gate-skip-reports-success
  mode: runtime
  target_mode: static
  severity: high
  stack:
  - cloudflare
  - web
  - ci
  globs:
  - '**/.cloudflare/*.sh'
  - '**/branch-gate*.sh'
  detect:
    type: grep
    has: 'WORKERS_CI_BRANCH|rev-parse --abbrev-ref'
    lacks: 'FATAL|exit 1'
  message: 'A CI branch gate whose skip path returns exit 0 makes "nothing was deployed" indistinguishable from "deployed successfully" in the dashboard. Any failure to identify the branch — CI variable renamed, detached checkout falling back to the literal HEAD, production branch drifting from the name the gate matches — yields a GREEN build that silently no-ops the production deploy.'
  fix: 'Fail fast (exit 1) on an empty/HEAD/unknown branch instead of falling through to skip: a red build beats a silent no-op on prod. Separately, smoke that the target URL actually serves the new version — "build success" is not deploy verification.'
  source: 'review 2026-07-20 cloudflare-workers-builds-branch-gate; reproduced locally: WORKERS_CI_BRANCH=HEAD -> mode=skip -> green build, prod untouched. See docs/solutions/ci-deploy/cloudflare-workers-builds-branch-gate-2026-07-20.md'
- id: portal-callable-contract-unverified
  mode: runtime
  severity: medium
  stack: [cloudflare, web, backend]
  globs: ["**/*.kt", "**/*.ts"]
  detect:
    type: grep
    has: 'build\w*Payload|VIDEO_MODELS|backendModel'
  message: 'Diff меняет payload-ключи / model-whitelist / enum, уходящие в Cloud callable (build*Payload put-ключи, VIDEO_MODELS, engine.backendModel), контракт «принятые ключи + сериализация» заявлен только in-code комментарием -> backend rejects (invalid-argument) или тихо дропает->дефолт.'
  fix: 'Верифицировать против ФАКТИЧЕСКИ задеплоенного callable реальным прод-путём; инструментировать обе стороны границы (продюсер+консьюмер) за один прогон.'
  source: 'portal-контракт рекуррентно: 07-07 durationSec drop, 07-09, 07-10, 07-14 (>=4 итерации, commit 34d0e908a); deferred_portal_video_generation_backend.md'
