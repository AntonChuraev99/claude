# other — misc recurring bugs not yet in a dedicated area. Mined 2026-06-29; runtime probation.
# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: compose-resources-backslash-escaped-string
  mode: runtime
  severity: low
  stack:
  - kmp
  - compose
  globs:
  - '**/composeResources/**/strings.xml'
  detect:
    type: grep
    has: \\['"]
    unless: ^\s*<!--|-->
  message: Backslash-escaped quote/apostrophe in a Compose Multiplatform composeResources string — CMP does NOT strip the escape (unlike Android res), so the backslash renders literally in the UI.
  fix: Use bare, unescaped quotes/apostrophes in composeResources strings.xml (Don't, Tap "Open Settings"). Only & still needs an XML entity (&). Do not carry Android \' / \" escaping habits into CMP Resources. Glob is scoped to composeResources so androidMain res/values/strings.xml (where \' / \" ARE correct) is untouched.
  source: 'app: docs/solutions/ui-improvements/compose-resources-string-escaping.md'
- id: mock-data-production-fallback
  mode: runtime
  severity: high
  stack:
  - kmp
  - android
  globs:
  - '**/src/{main,commonMain,androidMain,iosMain}/**/*.kt'
  detect:
    type: grep
    has: \bval\s+(MOCK|FAKE|STUB|DUMMY)_[A-Z0-9_]+\s*=\s*(listOf|mutableListOf|mapOf|setOf|arrayOf|[A-Z]\w*\s*\()
    unless: '@Preview|BuildConfig\.DEBUG|isDebug\(\)|AppBuildConfig\.isDebug|review-rules:allow-mock'
    lacks: review-rules:allow-mock
  message: Mock/stub constant (MOCK_/FAKE_/STUB_/DUMMY_) declared in a production source set — used as a load/read-failure fallback it hides the error and feeds garbage downstream.
  fix: 'Remove mock/stub fallbacks from production paths: on load/read failure show a visible error + retry and log it (analytics + AppLogger.error), never substitute fabricated data and clear the error. Keep MOCK_/FAKE_/STUB_/DUMMY_ data only in test source sets, @Preview functions, or debug-gated code (or annotate an intentional case with // review-rules:allow-mock).'
  source: runtime-errors/paywall-mock-product-silent-failure.md; runtime-errors/content-uri-photo-analysis-failure.md
- id: prerelease-dep-bump-needs-clean-build
  mode: runtime
  severity: high
  stack:
  - kmp
  - android
  globs:
  - '**/libs.versions.toml'
  - '**/*.versions.toml'
  detect:
    type: grep
    has: (?i)=\s*"\d[^"]*-(alpha|beta|rc|eap|dev|snapshot|pre|m\d)
    unless: (?i)#.*(clean-build|arm64|smoke|verified|pinned-prerelease)
  message: A pre-release (alpha/beta/rc/snapshot) dependency version is set in the version catalog — these ship breaking API + native (ARM64) changes between builds and the local Gradle daemon klib cache masks the skew until a clean CI build or a real device hits it.
  fix: 'After bumping any pre-release dep run a clean no-cache build (./gradlew --rerun-tasks --no-build-cache compileKotlinWasmJs assembleDebug) and smoke-test on a real ARM64 device (not an emulator) before merge; pin the exact alpha/beta version, prefer member APIs over moved top-level extensions, and read the changelog for suspend/artifact-split breaks. Red-flag (mode=runtime) not a hard block: pre-release versions are routine in KMP catalogs and a grep cannot confirm the clean-build/ARM64-smoke step, so a static HIGH here would block normal commits — annotate a verified line with a trailing ''# arm64 smoke clean-build verified'' comment to silence.'
  source: kmp/room3-alpha-sqlite-bundled-arm64-regression-2026-05-11.md; ci-deploy/sqlite-bundled-alpha04-suspend-member-api-2026-05-11.md
- id: toast-crashes-on-background-thread
  mode: static
  severity: high
  stack:
  - android
  - kmp
  globs:
  - '**/androidMain/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: \bToast\.makeText\b|^\s*import\s+android\.widget\.Toast
    unless: review-rules:allow-toast|//
  message: 'Toast.makeText requires the main looper. The global Koin CoroutineScope is CoroutineScope(SupervisorJob()+Dispatchers.Default), so any scope.launch{}/onSuccess callback that reaches a Toast runs on a background thread → NullPointerException "Can''t toast on a thread that has not called Looper.prepare()" crashes the whole app (e.g. Save/Download on a share result screen). Toast is also banned for in-app notifications — App Top Banner is the only channel.'
  fix: 'Replace every user-facing Toast with ShowTopBannerUseCase (AppBannersRepository.showBanner = Channel.trySend, thread-safe from any thread; resolve stringResource in the Composable and pass the texts into non-Composable handlers via a small data class, like DownloadBannerTexts). Any other UI/Activity call reached from a background scope.launch (startActivityForResult, dialogs) must be wrapped in withContext(Dispatchers.Main). A genuinely dev-only Toast in DebugMenu / debug-gated code: annotate the line with // review-rules:allow-toast.'
  source: 'media-share result screen: Toast.makeText inside scope.launch on the global Dispatchers.Default Koin scope crashed Save/Download, 2026-07-10'

- id: analytics-event-feeds-behavior-observer
  area: other
  mode: runtime
  severity: medium
  tags:
  - analytics
  - kmp
  globs:
  - '**/*ViewModel.kt'
  - '**/*Dispatcher*.kt'
  - '**/*UseCase.kt'
  - '**/App.kt'
  detect:
    type: grep
    has: analyticsTracker\.event\(
    unless: review-rules:allow-observed-event|//
  message: 'An analytics emit routed through ObservableAnalyticsTracker is NOT observability-only. CsatManager subscribes to a set of event names (EVENT_*/WEIGHTS) and increments a LIFETIME counter that awards weight at the 3rd/5th checklist — so adding an emit on a previously-silent path changes who gets shown the CSAT survey, i.e. product behaviour, under a feat(analytics) label. It also contaminates the baseline of any open verify-todo on csat_shown, making "did the rework lift shows?" unanswerable.'
  fix: 'Check the event name against CsatManager EVENT_*/WEIGHTS. If it is observed: estimate the delta in eligible users, and do not ship it in the same release as an open CSAT verify-todo (or rewrite that todo to account for the new paths). If the emit is genuinely inert, annotate the line with // review-rules:allow-observed-event.'
  source: 'review 2026-07-15 (19ea4c7b): checklist_created added to chat/attachment/gallery paths; CsatManager.kt:105,170 observes it; collided with docs/todos/2026-07-10-verify-csat-scored-metrics.md'

- id: appwide-scope-without-supervisor-or-catch
  area: other
  mode: static
  severity: high
  globs:
  - '**/di/*Module.kt'
  detect:
    type: grep
    has: CoroutineScope\(\s*Dispatchers\.\w+\s*\)
    unless: SupervisorJob|//|review-rules:allow-unsupervised-scope
  message: 'An app-wide singleton CoroutineScope built as CoroutineScope(Dispatchers.X) has NO supervision: the factory supplies a plain Job() when the context carries none, so ONE failing child cancels the singleton Job and every later launch{} on that scope becomes a silent no-op for the rest of the process — sync, credits convergence and any user-data write that shares the scope die together, with no crash and no log to point at. The blast radius escalates the moment a ViewModel moves a destructive persist onto this scope to survive its own back-stack pop: a single Room/OPFS throw turns "this one write failed" into "nothing writes again until restart".'
  fix: 'Pin a SupervisorJob: CoroutineScope(SupervisorJob() + Dispatchers.Default) — consumers of an app-wide scope are independent, so a failure must stay local to the child that threw. Separately, guard every critical persist launched on it with runCatching + AppLogger.error (no CoroutineExceptionHandler is installed by default, so an uncaught throw reaches the default handler and crashes the process). If the scope is deliberately fail-fast, annotate with // review-rules:allow-unsupervised-scope.'
  source: 'review 2026-07-15 (a4abf621): confirmFolderDelete moved its persist onto the app-wide Koin scope to survive its own navigator.onBack() pop, becoming the first unguarded write consumer of a scope that had no SupervisorJob; 5 consumers shared it. Found by bug-pattern-reviewer on PR#12.'

- id: textfield-icon-slot-conditional-null
  area: other
  mode: runtime
  severity: medium
  tags:
  - compose
  - kmp
  globs:
  - '**/*.kt'
  detect:
    type: grep
    has: (trailingIcon|leadingIcon)\s*=\s*\{
  message: 'Material3 wraps ANY non-null trailingIcon/leadingIcon of (Outlined)TextField in a defaultMinSize(48dp) slot. An always-non-null lambda with conditional visibility INSIDE (AnimatedVisibility/if) keeps 48dp of dead space reserved while the icon is hidden — the placeholder gets truncated/ellipsised earlier than it should. Fires on every icon-slot line: check whether the icon is meant to be conditional.'
  fix: 'Move the condition OUTSIDE the slot: trailingIcon = if (cond) { { Icon(...) } } else null. Never hide an icon inside an always-non-null slot lambda.'
  source: 'catalog search field 2026-07-16: clear-X wrapped in AnimatedVisibility reserved 48dp on the empty field and clipped the placeholder'

- id: raw-material-textfield-outside-designsystem
  area: other
  mode: static
  severity: medium
  tags:
  - compose
  - kmp
  globs:
  - '**/src/*Main/**/*.kt'
  - '**/src/main/**/*.kt'
  detect:
    type: grep
    has: import androidx\.compose\.material3\.(OutlinedTextField|TextField)$
    lacks: fun AppOutlinedTextField
  message: 'Raw Material3 (Outlined)TextField outside the design-system wrapper: Material renders the placeholder with its own bodyLarge while the input uses textStyle — the empty vs filled field round to different integer heights (1-2px vertical jump the moment typing starts); a long placeholder also wraps and inflates the field; icon slots silently reserve 48dp.'
  fix: 'Use the project text-field wrapper (e.g. AppOutlinedTextField in core/designsystem: placeholder style=textStyle, maxLines follows singleLine). A raw OutlinedTextField is acceptable only with an explicit fixed-lineHeight textStyle AND the same style passed to the placeholder.'
  source: 'catalog search field 2026-07-16 (height jump on first char) + auth email/password jump 2026-07-07 — same class, recurs'
