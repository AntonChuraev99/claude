- id: composeresources-cvr-cache-policy
  mode: runtime
  severity: high
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/_headers'
  - '**/resources/_headers'
  detect:
    type: grep
    has: /composeResources/
  message: _headers declares a /composeResources/* cache block — verify it is max-age=0/must-revalidate. Fixed-name no-hash .cvr blobs served with non-zero max-age desync from content-hashed wasm and boot-crash on Base64.decode (string-heavy screens crash in normal Chrome, work in incognito).
  fix: 'Two-layer gate: (1) _headers `/composeResources/*` -> `Cache-Control: public, max-age=0, must-revalidate`; (2) in init.js patch globalThis.fetch to force cache:''no-cache''/''reload'' on any `/composeResources/` URL (programmatic fetch ignores hard-refresh). Note: _headers cannot exclude by extension (rules comma-join), so client-side JS enforcement is mandatory. Keep a smoke-test that RED-fails on max-age>0.'
  source: wasm-bugs/stale-sw-poisoned-cache-base64-crash-2026-05-26.md; wasm-bugs/web-composeresources-cache-base64-crash-2026-06-03.md
- id: initjs-window-sentry-dead-channel
  mode: runtime
  severity: medium
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/**/*.js'
  detect:
    type: grep
    has: window\.Sentry\.
  message: init.js calls window.Sentry.* — the Sentry SDK is imported as ESM into the Kotlin/Wasm bundle and never exposed on window, so every window.Sentry call is a silent no-op and OAuth diagnostics never reach Sentry (sign-in failures stay undiagnosable).
  fix: Diagnose via console.log + write the outcome to globalThis.__xResult, then poll it from Kotlin (GlobalScope.launch + delay loop) and emit logger.e with the full trail -> a real unfiltered Sentry event.
  source: ci-deploy/apple-signin-web-safari-popup-blocked-diag-relay-2026-06-16.md
- id: layout-sizing-gated-by-platform-not-width
  mode: runtime
  severity: medium
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  detect:
    type: grep
    has: isWebPlatform\(\)\s*\)\s*\d+(\.dp|\s+else|\s*\))
    unless: isWideLayout|rememberIsCompactWindow|WindowWidthSizeClass|cornerRadius|elevation|\.blur|\.alpha|borderRadius|cornerSize|\.shadow
  message: 'Compose layout/sizing (grid columns, card/button width, split layout) branched on isWebPlatform() returning a numeric column count or .dp — platform is the wrong axis: wide Android tablets get the cramped mobile layout, narrow mobile browsers get the desktop layout.'
  fix: 'Use isWideLayout() / rememberIsCompactWindow() (600dp breakpoint, Material3 Adaptive) for width-driven sizing: `val columns = if (isWideLayout()) 4 else 2`. Reserve isWebPlatform() for platform integrations (media picker, Firebase, emoji font, HTML5 video). Never mix platform and width in one variable.'
  source: architecture/adaptive-layout-by-window-width-pattern-2026-05-12.md; kmp/appbutton-width-adaptive-expect-actual-composable-2026-05-18.md
- id: nested-viewport-compositionlocal-not-reprovided
  mode: runtime
  severity: high
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/wasmJsMain/**/*.kt'
  detect:
    type: grep
    has: (ComposeOverVideoContent|NestedComposeViewport)\s*[({]
    unless: fun (ComposeOverVideoContent|NestedComposeViewport)
    lacks: CompositionLocalProvider
  message: wasmJs over-video overlay (ComposeOverVideoContent/NestedComposeViewport == a fresh ComposeViewport root) used with no CompositionLocalProvider in the file — parent CompositionLocals don't cross the viewport boundary, so LocalEmojiFont/LocalFontFamilyResolver fall back to default (emoji tofu / blank text on mobile Safari) and LocalAnalyticsHelper crashes with IllegalStateException 'not provided'.
  fix: Capture needed locals OUTSIDE the overlay (val emojiFont = LocalEmojiFont.current; LocalFontFamilyResolver.current; LocalAnalyticsHelper.current), then wrap ONLY the overlay content block in CompositionLocalProvider(LocalEmojiFont provides emojiFont, ...) { ... } — not the BoxScope.align scaffolding. No-op on Android.
  source: kmp/composeover-video-nested-viewport-emoji-z-order-2026-04-29.md; wasm-bugs/dialog-over-video-wasmjs-2026-05-18.md; wasm-bugs/topbanner-empty-text-mobile-safari-nested-viewport-font-2026-05-29.md; wasm-bugs/web-feedback-sheet-compositionlocal-reprovide-2026-06-09.md
- id: wasmjs-bootstrap-error-handler-suppresses
  mode: runtime
  severity: high
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/**/*.js'
  - '**/wasmJsMain/resources/**/*.html'
  - '**/wasmJsMain/resources/**/*.template'
  detect:
    type: grep
    # Только GLOBAL-таргеты: element-level `el.addEventListener("error")` (video/img,
    # vendored lottie-web в generated web-react.js) — легитимные фолбэки, recurring FP.
    has: (window|globalThis|self)\.addEventListener\(\s*['\"](error|unhandledrejection)
  message: The wasmJs bootstrap installs a global error/unhandledrejection listener — verify it does NOT call event.preventDefault(). Blanket-suppressing the global handler swallows fatal wasm exceptions (e.g. the Base64/.cvr crash), keeping them out of console.error and Crashlytics and sending debugging down a false path.
  fix: Never blanket-suppress errors in the wasm bootstrap. Let exceptions propagate to console.error (and Crashlytics if wired); if you must intercept, log the full error first and only suppress a specific, identified benign case — never all unhandled errors.
  source: docs/solutions/web-infrastructure/splash-hang-corrupted-cvr-cache-2026-05-26.md
- id: wasmjs-emoji-text-missing-fontfamily
  mode: runtime
  severity: medium
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  detect:
    type: grep
    has: '"[^"]*[\U0001F300-\U0001FAFF]'
    unless: LocalEmojiFont|rememberEmojiAwareText|EmojiFont|emojiFont|emojiFontFamily|^\s*(//|\*|/\*)|//.*[\U0001F300-\U0001FAFF]
  message: 'Emoji literal in a commonMain Text with no explicit emoji fontFamily on the line — Skiko canvas has no system emoji fallback on wasmJs, so it renders as tofu on web (the same Text looks fine on Android, masking the bug). Red-flag: the font may be provided elsewhere, confirm by rendering on web.'
  fix: Wrap emoji-bearing text in rememberEmojiAwareText() and pass the returned fontFamily (LocalEmojiFont/Twemoji) on every Text; LocalEmojiFont is a no-op on Android so it is safe to apply unconditionally. Don't assume AppText/AppButton or strings/Remote-Config emoji are auto emoji-aware.
  source: kmp/emoji-rendering-wasms-text-fontfamily-2026-05-07.md; wasm-bugs/premium-price-arrow-tofu-2026-05-22.md; docs/solutions/emoji-rendering-wasms-preloadfont.md
- id: wasmjs-nonemoji-symbol-glyph-tofu
  mode: runtime
  severity: medium
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  detect:
    type: grep
    has: '[←-⇿①-⓿☀-➿⬀-⯿]'
    unless: ^\s*(//|\*|/\*)
  message: Non-emoji Unicode symbol literal (arrows/stars/checks/dingbats e.g. ★ ➜ ✓ ⚠) in commonMain Compose code renders as tofu (empty square) on wasmJs — Skiko has no CSS-style font fallback and neither the emoji font nor any web system font covers these ranges (Android's Roboto fallback hides it).
  fix: Render ornamental symbols as a vector AppIcon (composeResources drawable XML) or a Compose Canvas drawPath shape, or gate them out on web via isWebPlatform(); never rely on a font glyph for non-emoji symbols in commonMain shared with wasmJs.
  source: wasm-bugs/premium-price-arrow-tofu-2026-05-22.md; kmp/canvas-glyph-wasmjs-unicode-symbols-2026-04-29.md; ui-bugs/rate-dialog-stars-glyph-web-fix-2026-05-18.md
- id: webcodecs-h264-level-below-resolution
  mode: runtime
  severity: high
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/**/*.js'
  - '**/wasmJsMain/**/*.mjs'
  - '**/wasmJsMain/**/*.kt'
  detect:
    type: grep
    has: '[''"]avc1\.[0-9a-fA-F]{4}1f'
    unless: ^\s*(//|\*)
  message: WebCodecs H.264 codec string at Level 3.1 (avc1.*1f, e.g. avc1.42001f, ~720p ceiling) used to encode 1080p+ phone frames — strict HW encoders (iOS VideoToolbox) reject encode() ('Encoding task failed'); desktop Chrome silently tolerates it and isConfigSupported() returns true.
  fix: Use a level covering the resolution (avc1.42c028 Baseline 4.0 / avc1.4d4028 Main for <=1080p), downscale the long axis to <=1920 with even width/height via draw-to-OffscreenCanvas, and drop hardwareAcceleration:'prefer-hardware'. Validate level vs dimensions manually since isConfigSupported() does not.
  source: wasm-bugs/ios-webcodecs-trim-encoder-level-mismatch-2026-05-28.md; kmp/wasms-video-trim-webcodecs-mp4muxer-2026-05-21.md; kmp/wasms-upload-video-transcode-webcodecs-parity-2026-05-22.md

- id: css-border-on-rounded-pill-artifacts
  mode: runtime
  severity: medium
  stack: [wasmjs, web]
  globs: ["web-react/src/**/*.tsx", "web-react/src/**/*.css"]
  detect:
    type: grep
    has: 'rounded-(full|[23]?xl)[^"`]*\bborder(-\[|\b(?!-transparent|-none))|\bborder(-\[|\b)[^"`]*rounded-(full|[23]?xl)'
    unless: shadow-\[inset|border-transparent|border-none|^\s*(//|\*|/\*)
  message: 1px CSS `border` on a rounded pill/chip (border-radius near half-height) rasterizes with seams/uneven ring thickness at fractional DPR (Windows 125/150% scale) — looks clean at DPR=1 headless, artifacts on the user's real screen. Red-flag needing a visual check at deviceScaleFactor 1.25/1.5 (non-headless), not headless DPR=1.
  fix: Draw the ring with an inset box-shadow instead of border (`shadow-[inset_0_0_0_1px_<color>]`) — paints in one layer, no curve seams. Also prefer rounded-full over a fixed radius larger than half the element height (CSS clamps only one axis -> elliptical corners). Verify via test-web/chip-dpr-shot.mjs (screenshots at DPR 1.25/1.5).
  source: docs/active/web-home-compose-to-js-port-2026-06-30.md (Итер14 chips border artifact, 2026-07-02)

- id: web-shell-mirror-state-lags-host-push
  mode: runtime
  severity: medium
  stack: [wasmjs, web]
  globs: ["web-react/src/components/shell/**/*.tsx", "web-react/src/components/shell/**/*.ts"]
  detect:
    type: grep
    has: 'activeTab\s*===?'
    unless: ^\s*(//|\*|/\*)
  message: React-shell reveals/switches the content zone off a mirror of host state (activeTab from the async Kotlin onShell push) while navigation happens synchronously (emit + navigate) — for a frame the zone renders the STALE/default tab before the push lands = visible flash. Second occurrence of this class (transient settings-flash, glam activeTab-flash 2026-07-02).
  fix: Until the confirming onShell push arrives, keep the zone neutral/transparent, or optimistically set the mirrored activeTab from the emitted nav intent (reconcile on push). Verify live (not static screenshots) by clicking Compose tabs from a React-owned page and watching the first ~200ms.
  source: docs/active/web-home-compose-to-js-port-2026-06-30.md (Итер15 glam zone, 2026-07-02); deferred_web_home_js_port.md (transient settings-flash)

- id: web-bridge-pending-consume-not-in-initial-state
  mode: runtime
  severity: medium
  stack: [wasmjs, web]
  globs: ["web-react/src/**/*.ts", "web-react/src/**/*.tsx"]
  detect:
    type: grep
    # Только consume-строки вида `if (bridge.__pendingX) handle(...)` (эффект-consume после paint);
    # объявления типов (`__pendingX?: string`) и lazy-init (`parse(getBridge().__pendingX) ?? DEFAULT`) — не смелл.
    has: 'if\s*\(\s*\w+\.__pending\w+\s*\)'
    unless: ^\s*(//|\*|/\*)
  message: Consume of a bridge pending-stash (__pendingX) inside useEffect runs AFTER the first paint — the first frame renders DEFAULT_STATE even when the host push already landed before mount (flag/tab flash; 3rd occurrence of the mirror-lag class — generationEnabled 2026-07-16, glam activeTab-flash 2026-07-02).
  fix: Consume the stash in a lazy useState initializer — useState(() => parse(getBridge().__pendingX) ?? DEFAULT) — keeping useEffect only for live pushes; race-proof reference pattern is initialAuthState (WebReactBridge.wasmJs.kt).
  source: docs/solutions/web-generation-tab-feature-flag-2026-07-16.md (web2, 2026-07-16); docs/active/web-home-compose-to-js-port-2026-06-30.md (Итер15)

- id: initjs-eager-toplevel-webapi-factory-throws
  mode: runtime
  severity: high
  stack: [wasmjs, web]
  globs: ["app/src/wasmJsMain/resources/*.js"]
  detect:
    type: grep
    has: '^(const|let|var)\s+\w+\s*=\s*(getMessaging|getAnalytics|getPerformance)\('
    unless: ^\s*(//|\*)
  message: SDK factory (FCM/analytics/perf) called at init.js top level synchronously touches an optional Web API (navigator.serviceWorker / window.*) inside the factory; in restricted webviews (iOS Telegram WKWebView) that throws a TypeError at module-eval time, the whole init.js module dies, app.js is never injected and the loader spins forever (KMP-WEB-75/76).
  fix: Wrap in a lazy guarded getter (check the Web API truthy, try/catch the factory, return null on failure) and call it on first use — never at module-eval time. Repro guard - test-web/tg-webview-no-serviceworker-boot-test.mjs (strip navigator.serviceWorker, expect [BootDiag] kotlin-main-started).
  source: wasm-bugs/telegram-webview-no-serviceworker-boot-fix-2026-07-02.md; web-infra/boot-diagnostics-pre-wasm-telemetry-2026-07-02.md

- id: boot-resource-retry-no-terminal-spinner-state
  pain: 2
  mode: runtime
  severity: high
  stack: [wasmjs, web]
  globs: ["**/wasmJsMain/resources/*.js"]
  detect:
    type: grep
    has: 'onerror'
  message: "boot-инжектор скрипта с retry (onerror + повторный inject): exhausted-ветка (attempt >= MAX) обязана снять #loading и/или показать fallback, иначе исчерпание retry = вечный спиннер поверх мёртвого boot. Класс infinite-spinner рецидивил: KMP-WEB-75/76 (TG WebView), KMP-WEB-77/74/73 (фильтрующий VPN)."
  fix: "зеркалить app.js-ветку init.js: на attempt >= MAX — getElementById('loading')?.remove() + оставить net-trouble-баннер/показать fallback-экран."
  source: "docs/solutions/wasm-bugs/boot-resource-retry-vpn-filter-resilience-2026-07-02.md"

- id: icon-text-row-vertical-misalignment
  pain: 2
  mode: runtime
  severity: medium
  stack: [web, react]
  globs: ["web-react/src/**/*.tsx"]
  detect:
    type: grep
    has: 'items-center(?![^"}]*leading-)[^"}]*text-\[0\.[0-9]+rem'
  message: "flex-ряд иконка+текст с кастомным мелким размером (text-[0.Xrem]) без leading-*: наследованный line-height делает line-box текста выше глифов -> items-center сажает текст ниже иконки (иконка едет вверх, текст вниз). Рецидив: like-pill EffectCard 2026-07-03; юзер повторно репортит вертикальный перекос icon+text рядов."
  fix: "leading-none (или явный leading-N = высоте иконки) на текст/контейнер каждого flex-ряда иконка+текст; проверять глазом на карточке/пилюле, не только в коде."
