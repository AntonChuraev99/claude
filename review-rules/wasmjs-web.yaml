# wasmjs-web — Compose<->DOM interop, video, HiDPI. Prod-only failures: work at
# DPR=1 on desktop dev, break on real mobile / retina / production ESM.

- id: toPx-into-css-px
  pain: 3
  mode: static
  severity: high
  stack: [wasmjs, web]
  globs: ["**/wasmJsMain/**/*.kt", "**/*.wasmJs.kt", "**/wasmJs/**/*.kt"]
  detect:
    type: grep
    has: 'toPx\(\)[^"}]*\}?px"'
  message: "dp.toPx() в строку CSS px -> x2/x3 на HiDPI (48dp -> 432px, контейнер становится кругом). CSS px device-independent, браузер сам масштабирует."
  fix: "в CSS-строку класть dp.value (число dp), не toPx()."
  source: "agent-memory/kmp-expert/feedback_compose_to_web_css_interop_rule.md"

- id: external-var-top-level-esm
  mode: static
  severity: high
  stack: [wasmjs]
  globs: ["**/wasmJsMain/**/*.kt", "**/*.wasmJs.kt", "**/wasmJs/**/*.kt"]
  detect:
    type: grep
    has: '^\s*(private |internal |public )?external var '
  message: "top-level `external var` компилится в bare-name assign -> prod wasmJs падает ReferenceError на старте композиции; dev-сборка прощает (dev/prod asymmetry)."
  fix: "не top-level external var; объявлять через js()-expression / обёртку с присваиванием полю объекта."
  source: "improvements/2026-05-20-wasmjs-external-var-esm-pitfall.md"

- id: composeover-video-sizing
  mode: runtime
  severity: medium
  stack: [wasmjs]
  globs: ["**/*.kt"]
  detect:
    type: grep
    has: 'ComposeOverVideoContent\('
  message: "overlay поверх HTML5 video: fillMaxSize блокирует клики host-слоем; wrapContent/wrapContentHeight -> nested ComposeViewport меряет 0 -> overlay невидим."
  fix: "размер overlay: heightIn(min,max) + if(visible)-гейт, не fillMaxSize и не wrapContent*. Проверить кликабельность и видимость на вебе."
  source: "project-memory feedback_composeover_video_sizing + agent-memory reference_android_runtime_pitfalls §R9"

# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: csp-strips-loadbearing-origin
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/index.html'
  - '**/wasmJsMain/resources/**/*.html'
  detect:
    type: grep
    has: http-equiv=['\"]?Content-Security-Policy
    lacks: wasm-unsafe-eval
  message: wasmJs index.html ships a CSP meta tag missing 'wasm-unsafe-eval' (required to instantiate Kotlin/Wasm) — a CSP cleanup/dedup stripped a load-bearing keyword/origin, blanking the app at boot. Same class strips apis.google.com from connect-src (distinct origin from *.googleapis.com), silently killing Google auth.
  fix: Keep 'wasm-unsafe-eval' in script-src, and keep https://apis.google.com in BOTH script-src and connect-src (NOT covered by *.googleapis.com). Annotate these entries 'do not collapse during cleanup' and back them with a static smoke-test that RED-fails on removal before deploy.
  source: wasm-bugs/csp-apis-google-vs-googleapis-connect-src-2026-05-26.md; ci-deploy/recaptcha-audit-rollback-three-platform-blockers-2026-06-11.md
- id: firebase-authstateready-no-timeout
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/**/*.js'
  detect:
    type: grep
    has: authStateReady
    lacks: Promise\.race
  message: init.js awaits authStateReady()/setPersistence without a Promise.race timeout — opens IndexedDB and can hang forever on Safari Private/ITP, giving an infinite splash.
  fix: Wrap setPersistence (fallback chain IDB->local->session->inMemory) and authStateReady in Promise.race with a per-step setTimeout, proceeding as guest on timeout; guard the boot promise against the JS-fired-before-Kotlin race with an initial-fired flag.
  source: wasm-bugs/auth-promise-race-condition-infinite-loading-2026-04-09.md; kmp/wasms-safari-private-firebase-auth-persistence-fallback-2026-05-25.md
- id: oauth-popup-no-redirect-fallback
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/**/*.js'
  detect:
    type: grep
    has: signInWithPopup
    lacks: signInWithRedirect
  message: Firebase OAuth uses signInWithPopup with no signInWithRedirect fallback — breaks on Safari (ITP postMessage block) and mobile Android Chrome (popup auto-closes).
  fix: 'Branch by UA: Safari + mobile (Android Chrome/iOS) -> signInWithRedirect; keep signInWithPopup only behind a narrow !isSafari && !isMobile gate.'
  source: kmp/firebase-auth-same-origin-cf-worker-proxy-safari-itp-2026-05-26.md; wasm-bugs/google-signin-mobile-chrome-redirect-flow-2026-05-27.md; ci-deploy/apple-signin-web-safari-popup-blocked-diag-relay-2026-06-16.md; kmp/web-auth-providers-apple-email-2026-05-13.md
- id: rvfc-hardcoded-playbackrate-fps-collapse
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/**/*.js'
  detect:
    type: grep
    has: playbackRate\s*=\s*([2-9]|[1-9][0-9])
    lacks: captureSafePlaybackRate|AdaptivePlaybackPacer
  message: requestVideoFrameCallback capture loop sets a hardcoded high video.playbackRate (>=2) — RVFC fires once per compositor frame (~60Hz VSync), not per decoded frame, so sourceFps x rate > ~60 drops most frames and collapses output fps (e.g. 58fps -> ~14fps), worst on iOS Safari.
  fix: 'Keep sourceFps x playbackRate <= ~50Hz: start at 1.0, measure true source fps from the median of first N frame deltas, then switch once to an adaptive safe rate (captureSafePlaybackRate); derive output timestamps from metadata.mediaTime, not wall-clock.'
  source: wasm-bugs/ios-webcodecs-trim-fps-collapse-rvfc-playbackrate-2026-05-28.md; kmp/wasms-video-trim-webcodecs-mp4muxer-2026-05-21.md
- id: sentry-capturemessage-interpolated-title
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/commonMain/**/*.kt'
  - '**/wasmJsMain/**/*.kt'
  detect:
    type: grep
    has: (sentryCaptureMessage|captureMessage)\s*\(\s*"[^"\n]*\$\{?[A-Za-z]
  message: Variable interpolation ($var) inside a Sentry captureMessage title — Sentry fingerprints on the title text, so every distinct value (count/msg/ua/coroutine hash) forks a separate issue and breaks grouping/triage.
  fix: Keep the captureMessage title a static string (a stable error code); move all variable context to breadcrumb/extra/tags. browser/os are auto-tags so $ua is never needed in the title.
  source: ci-deploy/sentry-triage-app-gpu-recaptcha-2026-06-09.md; ci-deploy/sentry-triage-kmp-web-logger-consolidation-2026-06-12.md
- id: signinwithredirect-no-getredirectresult
  mode: runtime
  severity: high
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  globs:
  - '**/wasmJsMain/resources/**/*.js'
  detect:
    type: grep
    has: signInWithRedirect
    lacks: getRedirectResult
  message: init.js calls signInWithRedirect but never consumes the result via getRedirectResult() at boot — the redirect OAuth token is lost and onAuthStateChanged never fires.
  fix: On boot, await getRedirectResult(auth) (resolve/catch as non-fatal) BEFORE auth.authStateReady; for custom Apple form_post, consume the return fragment at boot before authStateReady.
  source: wasm-bugs/google-signin-mobile-chrome-redirect-flow-2026-05-27.md; ci-deploy/apple-signin-web-safari-popup-blocked-diag-relay-2026-06-16.md
- id: wasmjs-video-sound-not-wired-to-preference
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - wasmjs
  - web
  - kmp
  globs:
  - '**/wasmJsMain/**/*.kt'
  - '**/commonMain/**/*Video*.kt'
  - '**/commonMain/**/*Trim*.kt'
  detect:
    type: grep
    has: \bvar\s+(isSound|isSoundOn|isSoundEnable|isMuted|soundEnabled)\b
    unless: AppDataStore|VideoSoundController|ObserveSoundEnabledUseCase|SetSoundEnabledUseCase
  message: Web/wasmJs video screen declares local mute/sound state (var isSoundOn / isMuted) instead of reading the global AppDataStore sound preference, breaking the preference->player-><video> chain (video always muted or out of sync with the in-app toggle).
  fix: Drive video muted/volume from the shared VideoSoundController / ObserveSoundEnabledUseCase (single source of truth = AppDataStore.isSoundEnabled) via LaunchedEffect(controller) and use the shared SoundToggleButton; keep the playWithMute fallback that mutes only on NotAllowedError.
  source: wasm-bugs/web-video-sound-app-preference-2026-05-19.md; wasm-bugs/web-uploaded-video-sound-toggle-2026-06-03.md; wasm-bugs/web-sound-toggle-shared-pattern-2026-06-05.md
- id: apple-oauth-provider-google-only-param
