# process-gate — боль #5 и смежное поведение агента. Не код-паттерны: каждое
# правило = условие на diff/сессию (trigger) + вопрос, на который главный обязан
# ответить ПЕРЕД "готово". Эти правила L1-runner пропускает; их читают L3-гейт в
# /task-gate и агент bug-pattern-reviewer. Эти инварианты дублируют прозу из
# CLAUDE.md, но как явный triggered-чеклист, привязанный к конкретному diff.

- id: anti-regression-no-silent-removal
  pain: 5
  mode: process
  severity: high
  trigger: "diff удаляет user-facing элемент / отключает существующую функцию (скролл, состояние, ввод, навигация, кнопка) ЛИБО правит shared commonMain ради одной платформы; ИЛИ субагент уперся в технический блокер и 'решил сам' упростить."
  question: "Сохранены ли ВСЕ существующие функции тронутых компонентов? Если решение требует убрать функцию — вынес ли развилку через AskUserQuestion ДО реализации (что теряем / альтернатива), а не пометкой 'trade-off' постфактум? Технический блокер = сигнал диагностировать корень, не резать фичу."
  message: "молчаливое выпиливание фичи под видом 'trade-off' бьёт по доверию сильнее, чем нечинёный баг (прецеденты: LazyColumn->Column убрал скролл; гостевые nav-кнопки удалены при невозможности скомпилить width-порог)."
  fix: "diff с потерей функции -> STOP -> AskUserQuestion (что теряем / сохраняющая альтернатива) ДО отгрузки."
  source: "CLAUDE.md анти-регрессия + project-memory feedback_no_silent_feature_removal + widget-trampoline precedent"

- id: rejected-design-survives-under-a-new-name
  pain: 5
  mode: process
  severity: high
  trigger: "владелец отверг вариант дизайна или визуальный элемент после просмотра (кадр, устройство, макет), и работа продолжилась; ЛИБО дифф переименовывает группу дизайн-токенов/аксессоров (navPlinth* -> bottomChrome*, *Old -> *New) вместо их удаления."
  question: "Разложена ли отмена на ЧАСТИ поимённо — токен, аксессор, оверлей, модификатор, тест, голден — и у каждой проставлено 'удалено' или 'оставлено сознательно, потому что <причина>'? Переименование НЕ является удалением: переименованный элемент наследует одобрение нового варианта, которого ему никто не давал. Показан ли владельцу кадр ПОСЛЕ отмены, а не кадр варианта до неё?"
  message: "отмена дизайна применяется к атрибуту, который владелец назвал вслух (цвет, форма), а остальные части отменённого варианта уезжают дальше под новыми именами и обрастают KDoc, тестами и голденами — после чего выглядят как принятое решение, и каждый прогон verify переподтверждает их как контракт. Прецедент 2026-08-14 (feat/ux-overhaul): владелец отменил вариант бара D 'чернильный плинтус' после просмотра на устройстве, правка свелась к переименованию AppSurface.navPlinth* -> bottomChrome*, и градиентная тень 16dp (Transparent -> Black 7.5%/35%) — определяющая черта отменённого варианта — доехала до владельца тремя итерациями позже, имея к тому моменту собственный токен высоты, KDoc с обоснованием альф по темам, пиксельный тест на своё положение и 20 голденов."
  fix: "отмену разложить списком ДО первой правки: git diff по группе токенов отменённого варианта + grep по каждому аксессору -> таблица 'часть / удалена или оставлена / кем одобрено оставление'. Оставленную часть подтверждает владелец на СВЕЖЕМ кадре, не на кадре отменённого варианта. KDoc и голден пишутся ПОСЛЕ этого решения, а не вместо него."
  source: "разбор 2026-08-17 пропуска гейта на feat/ux-overhaul; зеркало anti-regression-no-silent-removal — та же боль #5, обратное направление (там молча исчезает нужное, здесь молча выживает отменённое)"

- id: repro-test-on-unreproduced-bug
  mode: process
  severity: high
  trigger: "баг-фикс, симптом НЕ воспроизведён локально, и пользователь >=1 раз сказал 'не помогло'."
  question: "Предложил ли репро-тест/harness через реальный production-путь (реальная среда, реальный DPR/девайс, не headless/мок) вместо ещё одного слепого патча? Порог — ПЕРВОЕ-второе 'не помогло', не 3 fail-loop'а."
  message: "слепые патчи поверх невоспроизведённого бага жгут итерации и доверие (прецедент web top-banner: ~4 слепых фикса, headless+dpr=1 не воспроизводили клип)."
  fix: "после первого 'не помогло' при невоспроизведении -> AskUserQuestion: (а) написать failing-репро через прод-путь; (б) доступ/данные для локального репро; (в) выбрать гипотезу слоя."
  source: "improvements/archive/2026-06-25 (deprecated alias) + CLAUDE.md stuck-fix circuit breaker"

- id: subagent-scope-and-no-commit
  mode: process
  severity: high
  trigger: "в сессии работал субагент-специалист."
  question: "`git diff --name-only` подтверждает, что субагент НЕ коммитил и НЕ вышел за scope (doc-writer — только docs/memory/stats; код-эксперт — только свои файлы)? Не выпилил ли что-то молча?"
  message: "субагенты ловятся на: самовольный git commit; doc-writer правит .kt; тихое удаление функции при упоре в блокер."
  fix: "после каждого субагента — аудит diff главным; субагент никогда не git add/commit; out-of-scope правки откатить."
  source: "project-memory feedback_subagents_no_commit + feedback_docwriter_scope_violation"

- id: deploy-verified-region-account-smoke
  pain: 4
  mode: process
  severity: high
  trigger: "diff тронул деплой (Cloud Functions/Run, wrangler, firebase deploy, регион функции)."
  question: "Регион и аккаунт сверены из единой константы? Сделан ли post-deploy smoke (`curl -X OPTIONS` против ФАКТИЧЕСКОГО клиентского URL -> 204 + ACAO)? Revision новее последнего коммита?"
  message: "wrong-region и deploy-skew дают одинаковый симптом (404 text/plain / CORS) и не локализуются без явной сверки региона и smoke."
  fix: "pre-deploy assert региона на 3 концах; post-deploy curl-OPTIONS smoke; gcloud ... describe --format='value(updateTime,state)' позже коммита."
  source: "backend-deploy/firebase-functions-region + cross-service-deployment-patterns.md"

# === mined 2026-06-29 (runtime probation; promote 0-FP target_mode:static after telemetry) ===
- id: onboarding-completion-flag-before-nav-out
  mode: runtime
  severity: medium
  probation: '2026-06-29'
  target_mode: static
  stack:
  - kmp
  - android
  globs:
  - '**/onboarding/**/*ViewModel.kt'
  detect:
    type: grep
    has: navigateTo(Main|Home|ChecklistDetail|Analyze|Dashboard)\w*\s*\(
    unless: ^\s*(//|\*|/\*)
    lacks: completeOnboarding|OnboardingPassed|markOnboardingComplet|onboardingComplete
  message: Onboarding ViewModel forward-navigates out of the flow (Main/Home/ChecklistDetail/Analyze) without persisting the completion flag — onboarding re-shows next launch and the A/B 'completed' arm under-counts.
  fix: Call completeOnboardingUseCase() (writes isOnboardingPassed=true to DataStore) on EVERY exit path (chip-seed, AI-analyze, skip, default) and ALWAYS before the forward navigate*; order is load-bearing (complete -> navigate, never the reverse). Ordering/multi-path variants where the use case IS referenced but mis-ordered fall to the L2 runtime reviewer, not this static rule.
  source: docs/solutions/features/onboarding-none-variant-2026-05-10.md; docs/completed/onboarding-3-variants-2026-06-19.md; docs/completed/welcome-onboarding-final-polish-2026-06-22.md; docs/decisions/onboarding-multimodality-variant-selection-2026-06-22.md

- id: remote-string-contract-assumed-not-captured
  mode: process
  severity: high
  trigger: "клиентский фикс сравнивает/нормализует ТОЧНУЮ строку из ответа удалённого сервиса (LLM-классификатор, Cloud Function, стор-API), а тест подставляет её фейком."
  question: "Снята ли эта строка с ЖИВОГО сервиса (или эхнута прод-копией/логом), или набор построен по догадке? Учтены ли вариации падежа/предлога/кавычек/регистра, которые сервис волен вернуть?"
  message: "equals-матч по невзятой с сервиса строке зелёный локально и no-op в проде: unit-тест с фейком фиксирует ДОПУЩЕНИЕ о контракте, а не контракт. Прецедент 2026-07-25 (deictic checklistHint): строка подтвердилась прод-копией ошибки, но падежная форма «в этот чеклист» не покрывалась и прошла бы мимо."
  fix: "снять реальный ответ на точный пользовательский текст (/test-firebase-function, firebase-functions/tests/) ЛИБО опереться на строку, которую прод уже эхает в ошибке/логе; нормализовать очевидные морфо-вариации, а не перечислять одну форму."
  source: "сессия 2026-07-25 deictic checklistHint (L2 bug-pattern-reviewer) + [[gemini-model-allowlist-must-be-probed]] + L3 suggest->create 07-23 (7 прогонов, не воспроизвёлся)"

- id: rc-fallback-arm-must-preserve-monetization-path
  mode: process
  severity: high
  trigger: "дифф меняет, в какой арм резолвится пустой/неизвестный Remote Config сентинел (fallback-ветка when/else в *VariantUseCase), ЛИБО меняет дефолтный арм онбординга/пейвола."
  question: "Сравнил ли ты НАБОРЫ пользовательских поверхностей старого и нового арма — пейвол, триал, авто-создание, — а не только имена значений? Если наборы расходятся, вынесена ли потеря через AskUserQuestion ДО реализации?"
  message: "Смена фолбэк-арма молча переносит ВСЮ RC-fail популяцию на другой пользовательский путь (в этом проекте это заметная доля новых юзеров). Если у армов разный набор монетизационных/активационных поверхностей, это revenue-решение, отгружаемое под лейблом fix(). Прецедент 2026-07-28 (79901ab5): EMPTY -> AI_WELCOME снял onboarding_trial-пейвол у ~89% популяции rc_activated=false, потому что WelcomeOnboardingViewModel не имеет ни одного navigateToPaywall; поймано только на L2, уже после реализации."
  fix: "Перед сменой фолбэка сделать дифф поверхностей обоих флоу: grep navigateToPaywall / PaywallViewModel / parametersOf(\"onboarding_trial\") / completeOnboarding по обеим веткам. Расхождение -> AskUserQuestion ДО кода + ADR. Отдельно проверить, что новый арм НЕ зависит от подсистемы, чей отказ и включает фолбэк (RC-fail -> App Check -> серверный AI-вызов)."
  source: "L2 review 2026-07-28 (79901ab5); docs/decisions/2026-07-28-rc-fallback-ai-welcome-drops-onboarding-paywall.md"

- id: no-code-on-protected-branch
  mode: process
  severity: high
  trigger: "в сессии были правки файлов git-репозитория (не ~/.claude), ЛИБО в сессии сработал хук protected-branch-guard, ЛИБО задача завершается коммитом."
  question: "`git rev-parse --abbrev-ref HEAD` в рабочем каталоге — не защищённая ветка (main/master/develop/release/*)? Работа шла в отдельном worktree, а результат уходит в транк через MR/PR, а не локальным merge? Если правка сознательно сделана в транке — это одно из зафиксированных исключений (hotfix по согласованию, конфиг ~/.claude, явная просьба пользователя), а не обход хука на автопилоте?"
  message: "прямая правка транка ломает ревью и откат: изменение попадает в main/develop без MR, без diff-ревью и без возможности отменить одной кнопкой. Хук protected-branch-guard ловит только Write/Edit главного агента — фоновые субагенты (run_in_background) PreToolUse НЕ наследуют, их правки в основном checkout ловятся только `git -C <main> status`."
  fix: "правки в транке -> `git stash` -> вернуть основной checkout на транк -> `git worktree add .claude/worktrees/<slug> -b <type>/<slug>` -> `git stash pop` в worktree -> push + MR/PR. Проект без строки в ~/.claude/config/protected-branches.local.json — завести её, иначе хук работает на дефолте."
  source: "CLAUDE.md «Защищённая ветка и worktree» + improvements/archive/2026-08-04-protected-branch-guard.md + improvements/archive/2026-07-20-worktree-guard-auto-register.md (4 прецедента записи субагентов в главный checkout)"

- id: contract-changing-diff-rewrites-its-own-guard-test
  mode: process
  severity: high
  trigger: "в одном диффе изменён контракт компонента И переписан либо удалён существующий тест этого же компонента (`git diff --diff-filter=M` по `*Test.kt` пересекается с SUT), ЛИБО сессионная дока содержит формулировку вида «старый тест кодировал прежнее правило — переписан под новый контракт»."
  question: "Смена спецификации теста согласована с владельцем ДО правки, или assert подогнан под новое наблюдаемое поведение? Сохранено ли прежнее измерение контрольным прогоном, чтобы регрессию было чем поймать, и держит ли оно ту же ГРАНИЦУ (верхнюю/нижнюю), что и удалённый тест?"
  message: "агент, меняя контракт, переписывает тест, который этот контракт стерёг, — и «тесты зелёные» после этого доказывает только внутреннюю согласованность диффа. Мутационная проверка не ловит: она валидна в момент создания теста, а подмена случается позже. Прецедент 2026-08-19 (FS-1133 заморозка пула автоплея): `smoothScroll_slotChurnStaysNearTheMinimum` держал ВЕРХНЮЮ границу на дребезг top-N и защищал тай-брейк сортировки плюс бакетирование видимости; заменивший его контрольный прогон держал НИЖНЮЮ — снятие тай-брейка оставило бы весь набор зелёным."
  fix: "смену спеки выносить AskUserQuestion ДО правки; прежнее правило оставлять контрольным прогоном на той же геометрии И с той же стороной границы; отдельно доказать мутацией, что контрольный прогон падает на снятии того инварианта, который стерёг удалённый тест."
  source: "L2 review 2026-08-19 (FS-1133 autoplay freeze) + CLAUDE.md «Тесты» (существующий тест не переписывается в одном диффе с кодом, который он проверяет) + прецедент Kent Beck"

- id: sentinel-made-reachable-without-consumer-audit
  mode: process
  severity: high
  trigger: "дифф расширяет домен значения — снимает коэрцию (`or fallback`/`?:` → явная проверка на None), выводит настройку на новую поверхность (админка, Remote Config, флаг), добавляет член enum — И обещание про новое значение живёт в конфиге, реестре полей или подписи формы, а не в коде потребителя."
  question: "Перечислены ли ВСЕ потребители символа (`ast-index usages`), и есть ли у каждого ветка на новодоступное значение? Обещание из реестра («0 выключает напоминание») код выполняет или инвертирует?"
  message: "фикс коэрции доводит до кода значение, которого там раньше не бывало, — и потребитель, писавшийся без этой ветки, делает ОБРАТНОЕ обещанному. Радиус при этом растёт вместе с поверхностью: правка секрета с рестартом становится двумя касаниями с телефона. Старый статический детектор гаснет вместе с удалённым `or`, поэтому ловится это только аудитом потребителей. Прецедент 2026-08-26 (телеграм-бот с веб-админкой, карточки текста): `reminder_delay = 0` в админке обещает «выключает», `asyncio.sleep(0)` в main.py шлёт напоминание немедленно каждому, кто открыл форму."
  fix: "фикс коэрции и аудит потребителей — один дифф. По каждому usages: есть ли ветка на новое значение; нет — добавить её и регрессионный тест именно на это значение, а не на соседнее."
  source: "L2 review 2026-08-26 (<your-project>, crm-webapp-text-cards)"

- id: contour-split-done-on-the-reader-only
  mode: process
  severity: high
  trigger: "дифф разводит по контурам (prod/stage), окружениям или арендаторам ИМЯ общего ресурса — параметр Remote Config, ключ кеша, топик, коллекцию, префикс бакета — и вычисление этого имени живёт больше чем в одном модуле."
  question: "Разведены ли ОБЕ стороны — и читатель, и писатель? Есть ли тест, сверяющий, что на каждом контуре они дают одно имя? Если общего модуля нет по устройству сборки, тест и есть единственный контракт."
  message: "split, сделанный только у читателя, даёт худший исход из возможных: писатель нестандартного контура правит БОЕВОЙ ресурс, а читатель этого контура ходит за ресурсом, которого никто не пишет. Половина фичи мертва по построению, вторая половина — авария, и обе выглядят как работающая система. Прецедент 2026-08-26 (телеграм-бот, два образа с общим Remote Config): `config.SETTINGS_PARAM` получил ветку по контуру, `cards.SETTINGS_PARAM` в соседнем образе остался константой."
  fix: "выводить имя из одного выражения на обеих сторонах; общего модуля нет (раздельные образы, разные пакеты) — обязателен парный тест «читатель и писатель дают одно имя на каждом контуре», по образцу теста паритета заголовков и секретов."
  source: "L2 review 2026-08-26 (<your-project>, crm-webapp-text-cards)"
