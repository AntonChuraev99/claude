<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a contact sheet. Each decision is a strip of frames; the picked frame gets a heavy mark. */
  :root {
    --ground: #eef1f5;
    --sheet: #ffffff;
    --well: #dfe4ec;
    --ink: #17202c;
    --muted: #55617a;
    --line: #c5cdd9;
    --mark: #1746c7;
    --mark-ink: #ffffff;
    --good: #0d6b45;
    --bad: #a3271b;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12161d; --sheet: #1b212b; --well: #0c0f14; --ink: #e8ecf3; --muted: #a0abbf;
      --line: #364052; --mark: #8fb0ff; --mark-ink: #0c1424; --good: #5fd3a2; --bad: #ff9c90;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12161d; --sheet: #1b212b; --well: #0c0f14; --ink: #e8ecf3; --muted: #a0abbf;
    --line: #364052; --mark: #8fb0ff; --mark-ink: #0c1424; --good: #5fd3a2; --bad: #ff9c90;
    color-scheme: dark;
  }

  body { background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--sans); }
  .page {
    max-width: 1180px; margin: 0 auto; display: grid; gap: 40px;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: grid; gap: 8px; max-width: 68ch; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; font-weight: 600; margin: 0; text-wrap: balance; }
  h2 { font-size: 1.25rem; line-height: 1.3; font-weight: 600; margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .decision { display: grid; gap: 16px; min-width: 0; }
  .decision-head { display: grid; gap: 4px; max-width: 68ch; }
  .frame-no { font: 500 0.8rem/1.4 var(--mono); letter-spacing: 0.04em; color: var(--muted); }

  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  .variant {
    display: grid; grid-template-rows: auto 1fr; min-width: 0; cursor: pointer;
    background: var(--sheet); border: 1px solid var(--line); outline: 3px solid transparent; outline-offset: -1px;
  }
  .variant.picked { outline-color: var(--mark); border-color: var(--mark); }
  .shots { display: flex; gap: 8px; padding: 8px; background: var(--well); overflow-x: auto; min-width: 0; align-items: flex-start; }
  .shot { flex: 1 0 auto; margin: 0; display: grid; gap: 4px; min-width: 0; max-width: 100%; justify-items: center; }
  .shot img { display: block; max-width: 100%; max-height: 60vh; width: auto; height: auto; }
  .variant-body { display: grid; gap: 8px; padding: 12px; align-content: start; }
  .pick { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; flex-wrap: wrap; min-width: 0; }
  .pick input { accent-color: var(--mark); width: 18px; height: 18px; margin: 0; flex: none; }
  .tag { font: 500 0.75rem/1 var(--mono); padding: 4px 6px; background: var(--mark); color: var(--mark-ink); }
  .summary { color: var(--muted); }
  .zoom {
    padding: 4px 0; border: 0; background: none; color: var(--mark);
    font: 500 0.75rem/1.3 var(--mono); text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .none { display: flex; gap: 8px; align-items: center; cursor: pointer; color: var(--muted); }
  .none input { accent-color: var(--mark); width: 18px; height: 18px; margin: 0; flex: none; }

  .finish { display: grid; gap: 12px; padding: 16px; background: var(--sheet); border: 1px solid var(--line); min-width: 0; }
  .finish label { font-weight: 600; }
  textarea {
    width: 100%; box-sizing: border-box; min-height: 88px; resize: vertical; padding: 8px;
    font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--line);
  }
  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .save {
    padding: 12px 24px; border: 0; background: var(--mark); color: var(--mark-ink);
    font: 600 1rem/1.2 var(--sans); cursor: pointer;
  }
  .save:disabled { opacity: 0.55; cursor: progress; }
  .count { font: 500 0.875rem/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { min-height: 1.5em; }
  .status.ok { color: var(--good); }
  .status.err { color: var(--bad); }
  pre.fallback {
    margin: 0; padding: 12px; overflow-x: auto; white-space: pre-wrap; user-select: all;
    font: 500 0.875rem/1.5 var(--mono); background: var(--ground); border: 1px solid var(--line);
  }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

  dialog { padding: 0; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); max-width: min(96vw, 1400px); max-height: 94vh; }
  dialog::backdrop { background: rgba(8, 12, 20, 0.72); }
  .dialog-bar { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 12px; }
  .dialog-bar button { padding: 4px 12px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); font: inherit; cursor: pointer; }
  #zoom-img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  @media (prefers-reduced-motion: no-preference) { .variant { transition: outline-color 120ms ease; } }
</style>

<main class="page">
  <header>
    <h1 id="title">Загружаю варианты…</h1>
    <p id="intro" class="muted"></p>
  </header>
  <div id="decisions" style="display:grid;gap:40px;min-width:0"></div>
  <section class="finish" id="finish" hidden>
    <label for="note">Что поправить в выбранном варианте</label>
    <textarea id="note" maxlength="2000" placeholder="Необязательно. Если ни один вариант не подошёл, напиши почему."></textarea>
    <div class="actions">
      <button class="save" id="save" type="button">Сохранить выбор</button>
      <span class="count" id="count"></span>
    </div>
    <p class="status" id="status" role="status"></p>
    <pre class="fallback" id="fallback" hidden></pre>
  </section>
</main>

<dialog id="zoom">
  <div class="dialog-bar">
    <span id="zoom-caption"></span>
    <button type="button" id="zoom-close">Закрыть</button>
  </div>
  <img id="zoom-img" alt="">
</dialog>

<script>
  const NONE = "none";
  const DOC_PATH = "choices/current";
  const el = (id) => document.getElementById(id);
  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };

  let manifest = null;
  const answers = {};

  function variantName(decision, id) {
    if (id === NONE) return "ни один не подходит";
    return decision.variants.find((v) => v.id === id)?.name ?? id;
  }

  function buildSummary(note) {
    const lines = [`Выбор дизайна сохранён, раунд ${manifest.round ?? 1}.`];
    for (const d of manifest.decisions) lines.push(`${d.question} — ${variantName(d, answers[d.id])}`);
    if (note) lines.push(`Примечание: ${note}`);
    return lines.join("\n");
  }

  function refreshCount() {
    const done = manifest.decisions.filter((d) => answers[d.id]).length;
    el("count").textContent = `Выбрано ${done} из ${manifest.decisions.length}`;
  }

  function pick(decision, id) {
    answers[decision.id] = id;
    const group = document.querySelector(`[data-decision="${CSS.escape(decision.id)}"]`);
    for (const card of group.querySelectorAll(".variant")) {
      const isPicked = card.dataset.variant === id;
      card.classList.toggle("picked", isPicked);
      card.querySelector("input").checked = isPicked;
    }
    group.querySelector(".none input").checked = id === NONE;
    refreshCount();
  }

  function openZoom(shot, variant) {
    el("zoom-img").src = shot.src;
    el("zoom-img").alt = `${variant.name}: ${shot.label ?? "скриншот"}`;
    el("zoom-caption").textContent = shot.label ? `${variant.name} · ${shot.label}` : variant.name;
    el("zoom").showModal();
  }

  function renderVariant(decision, variant) {
    const card = make("article", "variant");
    card.dataset.variant = variant.id;
    const shots = make("div", "shots");
    for (const shot of variant.shots) {
      const figure = make("figure", "shot");
      const img = make("img");
      img.src = shot.src;
      img.alt = `${variant.name}: ${shot.label ?? "скриншот"}`;
      img.loading = "lazy";
      img.addEventListener("error", () => {
        figure.replaceChildren(make("p", "status err", `Кадр не загрузился: ${shot.src}. Попроси Claude опубликовать страницу заново.`));
      });
      const zoom = make("button", "zoom", shot.label ? `${shot.label}: открыть крупно` : "Открыть крупно");
      zoom.type = "button";
      zoom.addEventListener("click", (event) => {
        event.stopPropagation();
        openZoom(shot, variant);
      });
      figure.append(img, zoom);
      shots.append(figure);
    }
    const body = make("div", "variant-body");
    const label = make("label", "pick");
    const radio = make("input");
    radio.type = "radio";
    radio.name = `decision-${decision.id}`;
    radio.id = `pick-${decision.id}-${variant.id}`;
    label.append(radio, make("span", "", variant.name));
    if (variant.recommended) label.append(make("span", "tag", "Рекомендую"));
    body.append(label);
    if (variant.summary) body.append(make("p", "summary", variant.summary));
    card.append(shots, body);
    card.addEventListener("click", () => pick(decision, variant.id));
    return card;
  }

  function renderDecision(decision, index, total) {
    const section = make("section", "decision");
    section.dataset.decision = decision.id;
    const head = make("div", "decision-head");
    if (total > 1) head.append(make("span", "frame-no", `Вопрос ${index + 1} из ${total}`));
    head.append(make("h2", "", decision.question));
    if (decision.why) head.append(make("p", "muted", decision.why));
    const strip = make("div", "strip");
    for (const variant of decision.variants) strip.append(renderVariant(decision, variant));
    const none = make("label", "none");
    const radio = make("input");
    radio.type = "radio";
    radio.name = `decision-${decision.id}`;
    radio.id = `pick-${decision.id}-none`;
    radio.addEventListener("change", () => pick(decision, NONE));
    none.append(radio, make("span", "", "Ни один не подходит, нужен новый вариант"));
    section.append(head, strip, none);
    return section;
  }

  function setStatus(text, kind) {
    el("status").textContent = text;
    el("status").className = `status${kind ? ` ${kind}` : ""}`;
  }

  function showFallback(summary) {
    el("fallback").textContent = summary;
    el("fallback").hidden = false;
  }

  const capability = (name) => window.claude?.use ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const dbReady = capability("db");
  const commentsReady = capability("comments");

  async function restore() {
    const db = await dbReady;
    if (!db) return;
    try {
      const snap = await db.doc(DOC_PATH).get();
      const saved = snap.exists ? snap.data() : null;
      if (!saved || saved.round !== (manifest.round ?? 1)) return;
      for (const d of manifest.decisions) {
        const id = saved.answers?.[d.id];
        if (id === NONE || d.variants.some((v) => v.id === id)) pick(d, id);
      }
      el("note").value = saved.note ?? "";
      setStatus("Выбор уже сохранён. Измени его и сохрани снова, если передумал.", "ok");
    } catch {
      /* The page still works: the viewer picks again and the save reports any store failure. */
    }
  }

  async function notifyClaude(summary) {
    const comments = await commentsReady;
    if (!comments?.sendToClaude) return false;
    try {
      if ((await comments.canSendToClaude()) !== "available") return false;
      const anchor = await comments.anchorFor(el("save"));
      await comments.sendToClaude({ anchor, text: summary });
      return true;
    } catch {
      return false;
    }
  }

  async function save() {
    el("fallback").hidden = true;
    const missing = manifest.decisions.find((d) => !answers[d.id]);
    if (missing) {
      setStatus(`Выбери вариант в вопросе «${missing.question}».`, "err");
      document.querySelector(`[data-decision="${CSS.escape(missing.id)}"]`).scrollIntoView({ block: "start" });
      return;
    }
    const note = el("note").value.trim();
    const rejected = manifest.decisions.some((d) => answers[d.id] === NONE);
    if (rejected && !note) {
      setStatus("Напиши, что не подошло. Без этого Claude не сможет сделать новый вариант.", "err");
      el("note").focus();
      return;
    }

    const summary = buildSummary(note);
    el("save").disabled = true;
    setStatus("Сохраняю выбор…");
    try {
      const db = await dbReady;
      if (!db) {
        setStatus("Эта страница не может сохранить выбор здесь. Скопируй текст ниже и отправь его в чат с Claude.", "err");
        showFallback(summary);
        return;
      }
      await db.doc(DOC_PATH).set({
        round: manifest.round ?? 1,
        answers: { ...answers },
        note,
        summary,
        savedAt: new Date().toISOString(),
      });
      setStatus("Выбор сохранён. Передаю его Claude…", "ok");
      /* A comment holds 4 KiB, so the signal leaves the note in the store. */
      const signal = note ? `${buildSummary("")}\nЕсть примечание, оно лежит в базе страницы.` : summary;
      const delivered = await notifyClaude(signal);
      setStatus(
        delivered
          ? "Готово. Claude получил выбор и продолжит работу."
          : "Выбор сохранён. Напиши Claude в чат «забирай», и он прочитает выбор.",
        "ok",
      );
    } catch (error) {
      setStatus(
        error?.code === "invalid_argument"
          ? "У этого аккаунта нет права сохранить выбор. Отправь текст ниже в чат с Claude."
          : "Выбор не сохранён: сервис недоступен. Нажми кнопку ещё раз или отправь текст ниже в чат с Claude.",
        "err",
      );
      showFallback(summary);
    } finally {
      el("save").disabled = false;
    }
  }

  async function start() {
    try {
      const response = await fetch("picker.json");
      if (!response.ok) throw new Error(String(response.status));
      manifest = await response.json();
    } catch {
      el("title").textContent = "Варианты не загрузились";
      el("intro").textContent = "Страница не нашла файл picker.json. Попроси Claude опубликовать её заново.";
      return;
    }
    document.title = manifest.title;
    el("title").textContent = manifest.title;
    el("intro").textContent = manifest.intro ?? "";
    const total = manifest.decisions.length;
    manifest.decisions.forEach((d, i) => el("decisions").append(renderDecision(d, i, total)));
    el("finish").hidden = false;
    refreshCount();
    await restore();
  }

  el("save").addEventListener("click", save);
  el("zoom-close").addEventListener("click", () => el("zoom").close());
  start();
</script>
